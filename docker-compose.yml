# VidGen — one command to run everything:
#
#   docker compose up --build
#   → http://localhost:4321
#
# SECURITY: published ports remain loopback-only. The local UI holds API keys.
name: vidgen

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vidgen
      POSTGRES_USER: vidgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidgen_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidgen"]
      interval: 5s
      timeout: 3s
      retries: 5

  engine:
    build: ./engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      DATABASE_URL: postgres://vidgen:${POSTGRES_PASSWORD:-vidgen_dev}@postgres:5432/vidgen
      COMPOSE_URL: http://long-compose:4000

      # Shared FreeLLMAPI. Shorts owns the one container and encrypted provider
      # state; production deploy attaches this engine to the Shorts network.
      LLM_ROUTER_MODE: ${LLM_ROUTER_MODE:-freellmapi}
      LLM_ROUTER_FAIL_OPEN_TO_DIRECT: ${LLM_ROUTER_FAIL_OPEN_TO_DIRECT:-true}
      LLM_ROUTER_TIMEOUT_MS: ${LLM_ROUTER_TIMEOUT_MS:-120000}
      FREELLMAPI_BASE_URL: ${FREELLMAPI_BASE_URL:-http://freellmapi:3001/v1}
      FREELLMAPI_API_KEY: ${FREELLMAPI_API_KEY:-}
      FREELLMAPI_TEXT_MODEL: ${FREELLMAPI_TEXT_MODEL:-auto:smart}
      FREELLMAPI_VISION_MODEL: ${FREELLMAPI_VISION_MODEL:-auto:smart}

      # Experimental media routing. Media model ids are installation/catalog
      # specific, so `auto` is the only portable default. Paid providers remain
      # available for config-only rollback.
      IMAGE_PROVIDER_MODE: ${IMAGE_PROVIDER_MODE:-freellmapi}
      SPEECH_PROVIDER_MODE: ${SPEECH_PROVIDER_MODE:-freellmapi}
      FREELLMAPI_IMAGE_MODEL: ${FREELLMAPI_IMAGE_MODEL:-auto}
      FREELLMAPI_SPEECH_MODEL: ${FREELLMAPI_SPEECH_MODEL:-auto}
      FREELLMAPI_SPEECH_VOICE: ${FREELLMAPI_SPEECH_VOICE:-onyx}
      FREELLMAPI_SPEECH_FORMAT: ${FREELLMAPI_SPEECH_FORMAT:-mp3}
      FREELLMAPI_MEDIA_TIMEOUT_MS: ${FREELLMAPI_MEDIA_TIMEOUT_MS:-120000}

      # Optional hero-shot escalation: a separately-registered, quota-limited
      # model (e.g. a hosted trial API) reserved for RFC 0009 hero shots only.
      # Empty by default -- deliberately opt-in, since this is meant to stay a
      # scarce escalation, never the default image route.
      FREELLMAPI_HERO_IMAGE_MODEL: ${FREELLMAPI_HERO_IMAGE_MODEL:-}
      FREELLMAPI_HERO_IMAGE_MAX_CALLS: ${FREELLMAPI_HERO_IMAGE_MAX_CALLS:-10}

      # Paid OpenAI remains only for LLM fail-open/direct rollback.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}

      # Retained for SPEECH_PROVIDER_MODE=elevenlabs rollback.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}

      # Retained for IMAGE_PROVIDER_MODE=fal rollback and optional AI video.
      FAL_KEY: ${FAL_KEY:-}

      SCHEDULE_PRODUCE_HOURS: ${SCHEDULE_PRODUCE_HOURS:-}
      SCHEDULE_MEASURE_HOURS: ${SCHEDULE_MEASURE_HOURS:-24}

      # Legacy stock credentials retained for old/manual artifacts only.
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}

      YOUTUBE_ACCESS_TOKEN: ${YOUTUBE_ACCESS_TOKEN:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      AMOS_ALLOW_PUBLISH: ${AMOS_ALLOW_PUBLISH:-}
    volumes:
      - vidgen_data:/data
      - ./engine/config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      long-compose:
        condition: service_healthy

  # Video assembly: FFmpeg + Remotion. Cartoon scenes dominate this service;
  # stock/AI-video variables remain only as compatibility escape hatches.
  long-compose:
    build: ./long-compose
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4000"
    environment:
      OUTPUT_DIR: /app/outputs
      TOPIC_HISTORY_PATH: /app/data/topic_history.json
      NODE_OPTIONS: --max-old-space-size=4096
      COMPOSE_CONCURRENCY: ${COMPOSE_CONCURRENCY:-3}
      KENBURNS_UPSCALE: ${KENBURNS_UPSCALE:-3500}
      FAL_KEY: ${FAL_KEY:-}
      FAL_VIDEO_ENABLED: ${FAL_VIDEO_ENABLED:-}
      FAL_VIDEO_MODEL: ${FAL_VIDEO_MODEL:-fal-ai/ltx-video/image-to-video}
    volumes:
      - long_outputs:/app/outputs
      - long_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/topic-history"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

  # Legacy n8n flow: retained only behind an explicit profile.
  n8n:
    profiles: ["legacy"]
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5679/}
      NODE_ENV: production
      GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - long_n8n_data:/home/node/.n8n

volumes:
  pg_data:
  vidgen_data:
  long_outputs:
  long_data:
  long_n8n_data:

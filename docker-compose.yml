# VidGen — one command to run everything:
#
#   docker compose up --build
#   → http://localhost:4321
#
# Credentials can be set in the UI (they persist in the vidgen_data volume) or
# seeded from a .env file next to this one. See .env.example.
#
# SECURITY: both published ports are bound to 127.0.0.1 on purpose. The UI holds
# API keys and is unauthenticated by design; publishing it as "4321:4321" would
# expose it to your whole network. Do not change that unless you add auth.
name: vidgen

services:
  # Postgres: persistent state for runs, artifacts, blob registry.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vidgen
      POSTGRES_USER: vidgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidgen_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidgen"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The engine: reasoning agents, execution graph, artifact store, control UI.
  engine:
    build: ./engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      # Postgres connection
      DATABASE_URL: postgres://vidgen:${POSTGRES_PASSWORD:-vidgen_dev}@postgres:5432/vidgen
      # Inside the compose network the renderer is reachable by service name.
      COMPOSE_URL: http://long-compose:4000
      # Seeded from your shell or the .env beside this file. Empty is treated as
      # unset by the service, so a blank here never clobbers a key you saved in
      # the UI (which lives in the volume).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      YOUTUBE_ACCESS_TOKEN: ${YOUTUBE_ACCESS_TOKEN:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      # Set to 1 to allow real YouTube uploads. Off by default: a token alone
      # must never cause a publish. Uploads are private either way.
      AMOS_ALLOW_PUBLISH: ${AMOS_ALLOW_PUBLISH:-}
    volumes:
      # Blobs stay on filesystem (large binary files).
      - vidgen_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      long-compose:
        condition: service_healthy

  # Video assembly: FFmpeg + Remotion. Called by the engine's render worker.
  long-compose:
    build: ./long-compose
    restart: unless-stopped
    ports:
      # Exposed only for debugging; the engine reaches it over the internal network.
      - "127.0.0.1:4001:4000"
    environment:
      OUTPUT_DIR: /app/outputs
      TOPIC_HISTORY_PATH: /app/data/topic_history.json
      NODE_OPTIONS: --max-old-space-size=4096
      # Bound scene concurrency: 40-50 scenes built at once OOMs the container.
      COMPOSE_CONCURRENCY: ${COMPOSE_CONCURRENCY:-3}
      KENBURNS_UPSCALE: ${KENBURNS_UPSCALE:-3500}
      FAL_KEY: ${FAL_KEY:-}
      FAL_VIDEO_ENABLED: ${FAL_VIDEO_ENABLED:-}
      FAL_VIDEO_MODEL: ${FAL_VIDEO_MODEL:-fal-ai/ltx-video/image-to-video}
    volumes:
      - long_outputs:/app/outputs
      - long_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/topic-history"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Remotion renders in headless Chromium and is memory-hungry.
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

  # The pre-VidGen n8n pipeline. It no longer has a role: the engine owns the
  # execution graph and the UI owns human approval. Kept behind a profile so the
  # old A/B pipeline stays runnable while VidGen is unproven, but it does NOT
  # start with a plain `docker compose up`.
  #
  #   docker compose --profile legacy up
  n8n:
    profiles: ["legacy"]
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5679/}
      NODE_ENV: production
      GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - long_n8n_data:/home/node/.n8n

volumes:
  pg_data:
  vidgen_data:
  long_outputs:
  long_data:
  long_n8n_data:

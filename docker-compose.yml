# VidGen — one command to run everything:
#
#   docker compose up --build
#   → http://localhost:4321
#
# SECURITY: published ports remain loopback-only. The local UI holds API keys.
name: vidgen

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vidgen
      POSTGRES_USER: vidgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidgen_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidgen"]
      interval: 5s
      timeout: 3s
      retries: 5

  engine:
    build: ./engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      DATABASE_URL: postgres://vidgen:${POSTGRES_PASSWORD:-vidgen_dev}@postgres:5432/vidgen
      COMPOSE_URL: http://long-compose:4000

      # Shared FreeLLMAPI. Shorts owns the one container and encrypted provider
      # state; production deploy attaches this engine to the Shorts network.
      # Text is deliberately pinned to Gemini: RFC 0010 forbids `auto` model
      # routing for production creative decisions.
      LLM_ROUTER_MODE: ${LLM_ROUTER_MODE:-freellmapi}
      LLM_ROUTER_TIMEOUT_MS: ${LLM_ROUTER_TIMEOUT_MS:-120000}
      FREELLMAPI_BASE_URL: ${FREELLMAPI_BASE_URL:-http://freellmapi:3001/v1}
      FREELLMAPI_API_KEY: ${FREELLMAPI_API_KEY:-}
      # Ordered chain of concrete free models; empty = engine default. No paid fallback.
      FREELLMAPI_TEXT_MODELS: ${FREELLMAPI_TEXT_MODELS:-}
      # proxy (default): free text-only visual QA, no paid vision.
      VISUAL_QA_MODE: ${VISUAL_QA_MODE:-proxy}

      # Narration remains on the established ElevenLabs production path.
      SPEECH_PROVIDER_MODE: ${SPEECH_PROVIDER_MODE:-elevenlabs}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}

      # OpenAI is used for LLM fail-open/direct rollback, authoritative RFC 0010
      # visual QA, and the pre-TTS moderation boundary.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_IMAGE_QA_MODEL: ${OPENAI_IMAGE_QA_MODEL:-}
      OPENAI_MODERATION_MODEL: ${OPENAI_MODERATION_MODEL:-omni-moderation-latest}
      TTS_MODERATION_TIMEOUT_MS: ${TTS_MODERATION_TIMEOUT_MS:-30000}

      # RFC 0010 generation: fal.ai only. FAL_TEXT_TO_VIDEO_MODEL is isolated
      # from long-compose's older image-to-video FAL_VIDEO_MODEL contract.
      FAL_KEY: ${FAL_KEY:-}
      FAL_MODEL: ${FAL_MODEL:-fal-ai/flux-2}
      FAL_EDIT_MODEL: ${FAL_EDIT_MODEL:-}
      FAL_TEXT_TO_VIDEO_MODEL: ${FAL_TEXT_TO_VIDEO_MODEL:-fal-ai/kling-video/v2.5-turbo/pro/text-to-video}
      FAL_PRICE_PER_IMAGE: ${FAL_PRICE_PER_IMAGE:-}

      # RFC 0010 stock-video candidates are frame-verified before admission.
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}

      SCHEDULE_PRODUCE_HOURS: ${SCHEDULE_PRODUCE_HOURS:-}
      SCHEDULE_MEASURE_HOURS: ${SCHEDULE_MEASURE_HOURS:-24}

      # Legacy image-search credentials retained for old/manual artifacts only.
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}

      YOUTUBE_ACCESS_TOKEN: ${YOUTUBE_ACCESS_TOKEN:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      AMOS_ALLOW_PUBLISH: ${AMOS_ALLOW_PUBLISH:-}
    volumes:
      - vidgen_data:/data
      - ./engine/config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      long-compose:
        condition: service_healthy

  # Video assembly: FFmpeg + Remotion. Its legacy image-to-video path remains
  # unchanged while RFC 0010 runs as an isolated benchmark.
  long-compose:
    build: ./long-compose
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4000"
    environment:
      OUTPUT_DIR: /app/outputs
      TOPIC_HISTORY_PATH: /app/data/topic_history.json
      NODE_OPTIONS: --max-old-space-size=4096
      COMPOSE_CONCURRENCY: ${COMPOSE_CONCURRENCY:-3}
      KENBURNS_UPSCALE: ${KENBURNS_UPSCALE:-3500}
      FAL_KEY: ${FAL_KEY:-}
      FAL_VIDEO_ENABLED: ${FAL_VIDEO_ENABLED:-}
      FAL_VIDEO_MODEL: ${FAL_VIDEO_MODEL:-fal-ai/ltx-video/image-to-video}
    volumes:
      - long_outputs:/app/outputs
      - long_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/topic-history"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

  # Legacy n8n flow: retained only behind an explicit profile.
  n8n:
    profiles: ["legacy"]
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5679/}
      NODE_ENV: production
      GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - long_n8n_data:/home/node/.n8n

volumes:
  pg_data:
  vidgen_data:
  long_outputs:
  long_data:
  long_n8n_data:

# VidGen — one command to run everything:
#
#   docker compose up --build
#   → http://localhost:4321
#
# SECURITY: published ports remain loopback-only. The local UI holds API keys.
name: vidgen

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vidgen
      POSTGRES_USER: vidgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidgen_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidgen"]
      interval: 5s
      timeout: 3s
      retries: 5

  engine:
    build: ./engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      DATABASE_URL: postgres://vidgen:${POSTGRES_PASSWORD:-vidgen_dev}@postgres:5432/vidgen
      COMPOSE_URL: http://long-compose:4000

      # Shared FreeLLMAPI. Shorts owns the one container and encrypted provider
      # state; production deploy attaches this engine to the Shorts network.
      # Text walks an ordered chain of concrete free models (llm-routing.ts).
      # `auto` / `auto:*` is rejected everywhere — it lets the gateway silently
      # swap in a weaker model.
      LLM_ROUTER_MODE: ${LLM_ROUTER_MODE:-freellmapi}
      LLM_ROUTER_TIMEOUT_MS: ${LLM_ROUTER_TIMEOUT_MS:-120000}
      FREELLMAPI_BASE_URL: ${FREELLMAPI_BASE_URL:-http://freellmapi:3001/v1}
      FREELLMAPI_API_KEY: ${FREELLMAPI_API_KEY:-}
      # Ordered chain of concrete free models; empty = engine default.
      FREELLMAPI_TEXT_MODELS: ${FREELLMAPI_TEXT_MODELS:-}
      PAID_TEXT_FALLBACK: ${PAID_TEXT_FALLBACK:-true}

      # Narration remains on the established ElevenLabs production path.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-gZiz6WFdAxF6MKJ0s5s6}
      ELEVENLABS_SPEED: ${ELEVENLABS_SPEED:-1.0}
      ELEVENLABS_STABILITY: ${ELEVENLABS_STABILITY:-0.45}
      ELEVENLABS_STYLE: ${ELEVENLABS_STYLE:-0}

      # OpenAI is used for text fallback/direct rollback and pre-TTS moderation.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_MODERATION_MODEL: ${OPENAI_MODERATION_MODEL:-omni-moderation-latest}
      TTS_MODERATION_TIMEOUT_MS: ${TTS_MODERATION_TIMEOUT_MS:-30000}

      SCHEDULE_PRODUCE_HOURS: ${SCHEDULE_PRODUCE_HOURS:-}
      # long (16:9, dormant) | short (vertical 9:16 Shorts/Reels, <=60 s).
      # Unset = long. See engine/src/video-format.ts.
      VIDEO_FORMAT: ${VIDEO_FORMAT:-}
      # Shorts phase 2: Facebook/Instagram Reels cross-posting (crosspost.ts).
      # Dormant until the Page token and a Page and/or Instagram id are set.
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      # Instagram-login token (graph.instagram.com); renewed automatically, kept on /data.
      META_IG_ACCESS_TOKEN: ${META_IG_ACCESS_TOKEN:-}
      # Per-beat editor images (gpt-image-1-mini, ~$0.10/Short). 1 = on. Optional own key with its own spend cap.
      BEAT_IMAGES: ${BEAT_IMAGES:-0}
      # Automatic edit of Shorts from the beat images: off | ab (alternate with the editor) | all.
      AUTO_EDIT: ${AUTO_EDIT:-off}
      # Returned cuts publish one per day at this hour (Berlin), in upload order; "off" = immediately.
      DAILY_RELEASE_HOUR: ${DAILY_RELEASE_HOUR:-12}
      OPENAI_IMAGES_API_KEY: ${OPENAI_IMAGES_API_KEY:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v25.0}
      # Daily preparation slot is resolved from a local-time target, not a fixed
      # UTC hour, so it doesn't drift across a DST change. SCHEDULE_PRODUCE_HOUR_UTC
      # pins a literal UTC hour instead when set, overriding both of these.
      SCHEDULE_PRODUCE_TIMEZONE: ${SCHEDULE_PRODUCE_TIMEZONE:-Europe/Berlin}
      SCHEDULE_PRODUCE_LOCAL_HOUR: ${SCHEDULE_PRODUCE_LOCAL_HOUR:-3}
      SCHEDULE_PRODUCE_HOUR_UTC: ${SCHEDULE_PRODUCE_HOUR_UTC:-}
      SCHEDULE_MEASURE_HOURS: ${SCHEDULE_MEASURE_HOURS:-24}

      YOUTUBE_ACCESS_TOKEN: ${YOUTUBE_ACCESS_TOKEN:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      AMOS_ALLOW_PUBLISH: ${AMOS_ALLOW_PUBLISH:-}
      # Upload settings YouTube would otherwise guess. 27 = Education.
      YOUTUBE_CATEGORY_ID: ${YOUTUBE_CATEGORY_ID:-27}
      YOUTUBE_LANGUAGE: ${YOUTUBE_LANGUAGE:-en}
      YOUTUBE_PAID_PROMOTION: ${YOUTUBE_PAID_PROMOTION:-}

      # Human editor handoff. Each episode's draft + transcript/beat-list
      # package is uploaded to a dated subfolder under this Drive folder; the
      # run waits there until a final.mp4 is dropped back in.
      DRIVE_CLIENT_ID: ${DRIVE_CLIENT_ID:-}
      DRIVE_CLIENT_SECRET: ${DRIVE_CLIENT_SECRET:-}
      DRIVE_REFRESH_TOKEN: ${DRIVE_REFRESH_TOKEN:-}
      DRIVE_ROOT_FOLDER_ID: ${DRIVE_ROOT_FOLDER_ID:-}
      SCHEDULE_EDITOR_WATCH_LOCAL_HOUR: ${SCHEDULE_EDITOR_WATCH_LOCAL_HOUR:-18}
      # Off by default: the editor publishes straight to YouTube today and
      # never returns a final.mp4 to Drive. Set true to resume polling for one.
      EDITOR_RETURN_WATCH_ENABLED: ${EDITOR_RETURN_WATCH_ENABLED:-}
      EDITOR_RETURN_WEBHOOK_TOKEN: ${EDITOR_RETURN_WEBHOOK_TOKEN:-}
      # Remote editor UI through the cloudflared service below. Requests on
      # these hostnames are served only with a verified Cloudflare Access
      # login (engine/src/cf-access.ts); all three unset keeps the UI
      # loopback-only.
      UI_PUBLIC_HOSTS: ${UI_PUBLIC_HOSTS:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}

      # Operator alerting when driveUnattended() gives up on a blocked run.
      # Both opt-in; unset means no-op.
      OPERATOR_ALERT_WEBHOOK_URL: ${OPERATOR_ALERT_WEBHOOK_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OPERATOR_ALERT_EMAIL_TO: ${OPERATOR_ALERT_EMAIL_TO:-}
      OPERATOR_ALERT_EMAIL_FROM: ${OPERATOR_ALERT_EMAIL_FROM:-}
    volumes:
      - vidgen_data:/data
      - ./engine/config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      long-compose:
        condition: service_healthy

  # Audio-first video assembly with FFmpeg.
  long-compose:
    build: ./long-compose
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4000"
    environment:
      OUTPUT_DIR: /app/outputs
      TOPIC_HISTORY_PATH: /app/data/topic_history.json
      COMPOSE_CONCURRENCY: ${COMPOSE_CONCURRENCY:-3}
      # Suggested stock images/videos; missing keys or failed matches use background.
      FOOTAGE_MODE: ${FOOTAGE_MODE:-stock}
      FOOTAGE_LIBRARY: /app/footage
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      STOCK_CACHE_DIR: /app/data/stock-cache
    volumes:
      - long_outputs:/app/outputs
      - long_data:/app/data
      - ./media-library:/app/footage:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

  # Outbound-only Cloudflare Tunnel that gives the editor the UI at
  # UI_PUBLIC_HOSTS; no port is opened on the host or router. The public
  # hostname -> http://engine:4321 route and the Access login policy live in
  # the Cloudflare dashboard. Opt-in profile: deploy starts it only when
  # CLOUDFLARE_TUNNEL_TOKEN is set.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - engine

volumes:
  pg_data:
  vidgen_data:
  long_outputs:
  long_data:

# VidGen — one command to run everything:
#
#   docker compose up --build
#   → http://localhost:4321
#
# The tracked engine/config/cast_roster.default.json is the canonical recurring
# cast. Set CARTOON_CAST_PATH only when intentionally overriding the channel cast.
#
# SECURITY: published ports remain loopback-only. The local UI holds API keys.
name: vidgen

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vidgen
      POSTGRES_USER: vidgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidgen_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidgen"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One-shot model bootstrap. It is intentionally part of compose so a fresh
  # server does not start the engine before the local reasoning model exists.
  ollama-model-pull:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    command: ["/bin/sh", "-lc", "ollama pull \"$OLLAMA_MODEL\""]
    depends_on:
      ollama:
        condition: service_healthy

  engine:
    build: ./engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      DATABASE_URL: postgres://vidgen:${POSTGRES_PASSWORD:-vidgen_dev}@postgres:5432/vidgen
      COMPOSE_URL: http://long-compose:4000

      # Local-only reasoning. There is no Anthropic/remote fallback.
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-llama3.1:8b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}

      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}

      # Cartoon thumbnail artwork. Video scenes themselves are local SVG rigs.
      FAL_KEY: ${FAL_KEY:-}

      # Default/daily production uses the tracked recurring cast unless overridden.
      CARTOON_CAST_PATH: ${CARTOON_CAST_PATH:-/app/config/cast_roster.default.json}
      SCHEDULE_PRODUCE_HOURS: ${SCHEDULE_PRODUCE_HOURS:-}
      SCHEDULE_MEASURE_HOURS: ${SCHEDULE_MEASURE_HOURS:-24}

      # Legacy stock credentials retained for old/manual artifacts only.
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}

      YOUTUBE_ACCESS_TOKEN: ${YOUTUBE_ACCESS_TOKEN:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      AMOS_ALLOW_PUBLISH: ${AMOS_ALLOW_PUBLISH:-}
    volumes:
      - vidgen_data:/data
      - ./engine/config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-model-pull:
        condition: service_completed_successfully
      long-compose:
        condition: service_healthy

  # Video assembly: FFmpeg + Remotion. Cartoon scenes dominate this service;
  # stock/AI-video variables remain only as compatibility escape hatches.
  long-compose:
    build: ./long-compose
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4000"
    environment:
      OUTPUT_DIR: /app/outputs
      TOPIC_HISTORY_PATH: /app/data/topic_history.json
      NODE_OPTIONS: --max-old-space-size=4096
      COMPOSE_CONCURRENCY: ${COMPOSE_CONCURRENCY:-3}
      KENBURNS_UPSCALE: ${KENBURNS_UPSCALE:-3500}
      FAL_KEY: ${FAL_KEY:-}
      FAL_VIDEO_ENABLED: ${FAL_VIDEO_ENABLED:-}
      FAL_VIDEO_MODEL: ${FAL_VIDEO_MODEL:-fal-ai/ltx-video/image-to-video}
    volumes:
      - long_outputs:/app/outputs
      - long_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/topic-history"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

  # Legacy n8n flow: retained only behind an explicit profile.
  n8n:
    profiles: ["legacy"]
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5679/}
      NODE_ENV: production
      GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - long_n8n_data:/home/node/.n8n

volumes:
  pg_data:
  ollama_data:
  vidgen_data:
  long_outputs:
  long_data:
  long_n8n_data:

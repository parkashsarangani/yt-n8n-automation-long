<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B98A0"/>
      <stop offset="0.58" stop-color="#147D84"/>
      <stop offset="1" stop-color="#0D5B62"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9EE"/>
      <stop offset="1" stop-color="#E8DDCA"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#344B5D"/>
      <stop offset="1" stop-color="#1F2F3C"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0BE9A"/>
      <stop offset="1" stop-color="#D89974"/>
    </linearGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7EEF1"/>
    </linearGradient>
  </defs>

  <!-- neck -->
  <rect x="221" y="294" width="58" height="68" rx="18" fill="url(#skin)" stroke="#17212B" stroke-width="7"/>
  <path d="M225 330 Q250 344 275 330" fill="none" stroke="#C98968" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- jacket silhouette -->
  <path d="M178 346 Q250 316 322 346 L341 522 Q302 552 250 554 Q198 552 159 522 Z"
        fill="url(#jacket)" stroke="#17212B" stroke-width="9" stroke-linejoin="round"/>
  <path d="M163 385 Q179 361 207 350 L211 518 Q188 530 168 516 Z" fill="#0E666D" opacity="0.55"/>
  <path d="M337 385 Q321 361 293 350 L289 518 Q312 530 332 516 Z" fill="#0A555C" opacity="0.38"/>

  <!-- shirt and lapels -->
  <path d="M220 340 L250 382 L280 340 L297 522 L250 548 L203 522 Z"
        fill="url(#shirt)" stroke="#17212B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M178 346 L220 340 L250 382 L208 401 Z" fill="#0F6268" stroke="#17212B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M322 346 L280 340 L250 382 L293 401 Z" fill="#0F6268" stroke="#17212B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M250 384 V520" stroke="#C9BFAE" stroke-width="3" opacity="0.65"/>
  <circle cx="313" cy="431" r="7" fill="#F4E9D5" stroke="#0E666D" stroke-width="2"/>
  <path d="M299 464 h22" stroke="#B9E2E4" stroke-width="4" stroke-linecap="round" opacity="0.72"/>

  <!-- trousers -->
  <path d="M190 516 Q218 505 244 520 L238 660 L181 660 Z" fill="url(#pants)" stroke="#17212B" stroke-width="8" stroke-linejoin="round"/>
  <path d="M256 520 Q282 505 310 516 L319 660 L262 660 Z" fill="url(#pants)" stroke="#17212B" stroke-width="8" stroke-linejoin="round"/>
  <path d="M208 530 L204 646" stroke="#597184" stroke-width="4" opacity="0.45"/>
  <path d="M292 530 L296 646" stroke="#162630" stroke-width="4" opacity="0.45"/>

  <!-- shoes -->
  <path d="M175 651 Q146 654 142 679 L238 679 L238 652 Z" fill="url(#shoe)" stroke="#17212B" stroke-width="7" stroke-linejoin="round"/>
  <path d="M262 652 L262 679 L358 679 Q354 654 325 651 Z" fill="url(#shoe)" stroke="#17212B" stroke-width="7" stroke-linejoin="round"/>
  <path d="M151 673 H237 M263 673 H349" stroke="#49B4BA" stroke-width="5" stroke-linecap="round"/>
  <path d="M158 662 H222 M278 662 H342" stroke="#C7D8DF" stroke-width="3" stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" width="420" height="620">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4A2B23"/>
      <stop offset="1" stop-color="#704231"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8B5239"/>
      <stop offset="1" stop-color="#5C3328"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F8FCFF" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#CBEAFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Narrow architectural frame. Most of the 420px canvas stays transparent
       so the doorway reads as foreground depth instead of a giant brown card. -->
  <rect x="34" y="34" width="222" height="548" rx="22" fill="url(#frame)"/>
  <rect x="66" y="72" width="158" height="474" rx="14" fill="#DDF3FF" opacity="0.62"/>
  <rect x="84" y="92" width="122" height="430" rx="10" fill="#F8FCFF" opacity="0.50"/>

  <!-- Door leaf opens into perspective rather than facing camera flat-on. -->
  <path d="M250 64 L354 112 L330 552 L250 568 Z" fill="url(#leaf)"/>
  <path d="M267 104 L330 130 L314 514 L267 526 Z" fill="#A96A49" opacity="0.52"/>
  <circle cx="313" cy="330" r="11" fill="#F2C94C"/>

  <!-- Soft room light entering through the opening. -->
  <path d="M226 96 L418 28 L418 606 L226 522 Z" fill="url(#spill)" opacity="0.46"/>
  <path d="M60 576 H340" stroke="#1F2937" stroke-width="10" opacity="0.16" stroke-linecap="round"/>
</svg>

name: Apply cartoon pipeline hardening

on:
  push:
    branches:
      - agent/cartoon-pipeline-hardening-v2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cartoon-pipeline-hardening-v2
          fetch-depth: 0

      - name: Apply guarded source transforms
        id: transform
        shell: bash
        run: |
          set +e
          python .github/scripts/apply_cartoon_hardening.py > .github/hardening.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> .github/hardening.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate transformed source
        if: steps.transform.outputs.rc == '0'
        id: validate
        shell: bash
        run: |
          set +e
          {
            node --check long-compose/compose.js
            git diff --check
            ! grep -q '_lastThumbnailBackground\|_lastThumbnailLayout\|new Promise(async' long-compose/compose.js
            grep -q 'video resolution is 1920x1080 (16:9 landscape)' long-compose/tests/output-quality.test.js
          } >> .github/hardening.log 2>&1
          rc=$?
          echo "validation_exit_code=$rc" >> .github/hardening.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Remove one-shot machinery after success
        if: steps.transform.outputs.rc == '0' && steps.validate.outputs.rc == '0'
        run: |
          rm -f .github/scripts/apply_cartoon_hardening.py
          rm -f .github/scripts/trigger-hardening.txt
          rm -f .github/workflows/apply-cartoon-hardening.yml
          rm -f .github/hardening.log

      - name: Commit result or diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes produced' > .github/hardening.log
            git add .github/hardening.log
          fi
          if [ "${{ steps.transform.outputs.rc }}" = "0" ] && [ "${{ steps.validate.outputs.rc }}" = "0" ]; then
            git commit -m 'harden compose pipeline correctness and concurrency'
          else
            git commit -m 'record hardening transform diagnostic'
          fi
          git push origin HEAD:agent/cartoon-pipeline-hardening-v2

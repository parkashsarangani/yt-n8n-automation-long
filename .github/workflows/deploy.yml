name: Deploy to Production

# Deploys AMOS to the self-hosted HP Linux server (the same box the Shorts
# stack runs on). Ports are offset from that stack on purpose:
#
#   AMOS brain        127.0.0.1:4321
#   AMOS long-compose 127.0.0.1:4001    (Shorts uses 4000)
#   legacy n8n        127.0.0.1:5679    (Shorts uses 5678) — not started here
#
# The UI is loopback-bound and unauthenticated. Reach it from a laptop with an
# SSH tunnel, never by publishing the port. See README "Running on the server".

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      # One-time move from the pre-AMOS compose project name. Idempotent: a
      # no-op on every deploy after the first.
      - name: Migrate compose project name (yt-longform -> amos)
        run: bash scripts/migrate-from-yt-longform.sh

      - name: Build and deploy
        env:
          # All optional. Unset secrets arrive as empty strings, which the brain
          # treats as "not configured" — so a missing secret never clobbers a
          # credential already saved through the UI (those live in amos_data).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          # Publishing enabled. Uploads are always PRIVATE regardless.
          AMOS_ALLOW_PUBLISH: "1"
        run: |
          set -e

          echo "=== Building ==="
          # Layer cache kept: npm ci only reruns when package*.json changes.
          docker compose build brain long-compose

          echo "=== Starting ==="
          # up -d recreates changed services and leaves the rest alone. The
          # legacy n8n profile is not included, so it stays down.
          docker compose up -d --remove-orphans brain long-compose

      - name: Health check
        run: |
          set -e
          check() {
            local name=$1 url=$2 hdr=${3:-}
            local retry=0 max=24
            until curl -sf ${hdr:+-H "$hdr"} "$url" > /dev/null 2>&1; do
              retry=$((retry + 1))
              if [ $retry -ge $max ]; then
                echo "ERROR: $name did not come up after 120s"
                docker compose logs --tail=60 "$name"
                exit 1
              fi
              echo "waiting for $name ... ($retry/$max)"
              sleep 5
            done
            echo "$name OK"
          }

          check long-compose http://127.0.0.1:4001/topic-history
          # The Host header matters: the UI refuses any request that did not
          # arrive at localhost, and curl would otherwise send "127.0.0.1".
          check brain http://127.0.0.1:4321/api/config "Host: localhost"

      - name: Report
        run: |
          echo "=== Active graph and provider wiring ==="
          curl -s -H "Host: localhost" http://127.0.0.1:4321/api/config \
            | jq '{graph, providers: [.providers[] | {role, provider, real}]}' || true

      - name: Cleanup
        run: |
          docker image prune -f
          echo "=== Deploy complete ==="
          docker compose ps

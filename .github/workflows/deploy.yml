name: Deploy to Production

# Deploys VidGen to the self-hosted HP Linux server. Shorts owns the single
# FreeLLMAPI container/volume; Long joins its runtime network for text/vision.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Migrate compose project name (yt-longform -> vidgen)
        run: bash scripts/migrate-from-yt-longform.sh

      - name: Build and deploy
        env:
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          LLM_ROUTER_MODE: ${{ vars.LLM_ROUTER_MODE || 'freellmapi' }}
          LLM_ROUTER_FAIL_OPEN_TO_DIRECT: ${{ vars.LLM_ROUTER_FAIL_OPEN_TO_DIRECT || 'true' }}
          LLM_ROUTER_TIMEOUT_MS: ${{ vars.LLM_ROUTER_TIMEOUT_MS || '120000' }}
          # RFC 0010 creative text is pinned; no auto routing to weaker models.
          FREELLMAPI_TEXT_MODEL: gemini-3.5-flash
          FREELLMAPI_VISION_MODEL: ${{ vars.FREELLMAPI_VISION_MODEL || 'auto:smart' }}
          SHARED_LLM_NETWORK: ${{ vars.SHARED_LLM_NETWORK || 'yt-n8n-automation-shorts_default' }}

          SPEECH_PROVIDER_MODE: elevenlabs
          OPENAI_API_KEY: ${{ secrets.OPEN_AI_KEY }}
          OPENAI_MODERATION_MODEL: ${{ vars.OPENAI_MODERATION_MODEL || 'omni-moderation-latest' }}
          TTS_MODERATION_TIMEOUT_MS: ${{ vars.TTS_MODERATION_TIMEOUT_MS || '30000' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

          # RFC 0010 generation. Images and premium text-to-video are direct fal;
          # no FreeLLM image model or image fallback exists in Long.
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FAL_MODEL: ${{ vars.FAL_MODEL || 'fal-ai/flux-2' }}
          FAL_EDIT_MODEL: ${{ vars.FAL_EDIT_MODEL || '' }}
          FAL_TEXT_TO_VIDEO_MODEL: ${{ vars.FAL_TEXT_TO_VIDEO_MODEL || 'fal-ai/kling-video/v2.5-turbo/pro/text-to-video' }}
          FAL_PRICE_PER_IMAGE: ${{ vars.FAL_PRICE_PER_IMAGE || '' }}

          # RFC 0010 stock candidates. The resolver downloads and frame-verifies
          # the actual clips before using an exact selected segment.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          AMOS_ALLOW_PUBLISH: "1"
        run: |
          set -euo pipefail

          if [[ ! "$FREELLMAPI_TEXT_MODEL" =~ [Gg][Ee][Mm][Ii][Nn][Ii] ]]; then
            echo "::error::RFC 0010 requires a concrete Google Gemini text model; got $FREELLMAPI_TEXT_MODEL"
            exit 1
          fi
          if [[ "$FREELLMAPI_TEXT_MODEL" == auto* ]]; then
            echo "::error::FreeLLMAPI auto text routing is forbidden by RFC 0010"
            exit 1
          fi
          if [ -z "${FAL_KEY:-}" ]; then
            echo "::error::FAL_KEY is required: fal.ai is the sole image-generation provider"
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is required: production TTS is fail-closed behind OpenAI moderation"
            exit 1
          fi

          echo "=== Building ==="
          docker compose build engine long-compose

          echo "=== Starting ==="
          docker compose up -d --remove-orphans postgres engine long-compose

          echo "=== Attaching engine to shared FreeLLMAPI network ==="
          ENGINE_CID="$(docker compose ps -q engine)"
          if [ -z "$ENGINE_CID" ]; then
            echo "::error::cannot locate running VidGen engine container"
            exit 1
          fi

          if docker network inspect "$SHARED_LLM_NETWORK" >/dev/null 2>&1; then
            if ! docker inspect -f '{{json .NetworkSettings.Networks}}' "$ENGINE_CID" | grep -Fq "\"$SHARED_LLM_NETWORK\""; then
              docker network connect "$SHARED_LLM_NETWORK" "$ENGINE_CID"
            fi
            docker exec "$ENGINE_CID" node -e "fetch('http://freellmapi:3001/api/ping').then(r=>{if(!r.ok)throw Error(String(r.status));console.log('shared FreeLLMAPI reachable')}).catch(e=>{console.error(e.message);process.exit(1)})" || {
              if [ "${LLM_ROUTER_MODE}" = "freellmapi" ] && [ "${LLM_ROUTER_FAIL_OPEN_TO_DIRECT}" = "false" ]; then exit 1; fi
              echo "::warning::shared FreeLLMAPI unavailable; reasoning may use direct OpenAI fail-open"
            }
          elif [ "${LLM_ROUTER_MODE}" = "freellmapi" ] && [ "${LLM_ROUTER_FAIL_OPEN_TO_DIRECT}" = "false" ]; then
            echo "::error::strict FreeLLMAPI reasoning is selected but shared network $SHARED_LLM_NETWORK is absent"
            exit 1
          fi

          if [ "${LLM_ROUTER_MODE}" != "direct" ] && [ -z "${FREELLMAPI_API_KEY:-}" ]; then
            echo "::warning::FREELLMAPI_API_KEY is not configured for reasoning; direct OpenAI fail-open will be used"
          fi

          # Smoke the exact pinned text route. This proves the shared service can
          # actually serve Gemini rather than merely responding to /api/ping.
          if [ "${LLM_ROUTER_MODE}" != "direct" ] && [ -n "${FREELLMAPI_API_KEY:-}" ]; then
            docker exec "$ENGINE_CID" node -e "const k=process.env.FREELLMAPI_API_KEY,m=process.env.FREELLMAPI_TEXT_MODEL;fetch('http://freellmapi:3001/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify({model:m,messages:[{role:'user',content:'Reply with exactly: OK'}],max_completion_tokens:16,reasoning_effort:'none'})}).then(async r=>{if(!r.ok)throw new Error('Gemini text smoke '+r.status+': '+(await r.text()).slice(0,300));const j=await r.json();if(!j.choices?.length)throw new Error('Gemini text smoke returned no choices');console.log('FreeLLMAPI pinned text smoke OK: '+(j.model||m))}).catch(e=>{console.error(e.message);process.exit(1)})"
          fi

          # Pre-TTS moderation is a hard production dependency, independent of
          # reasoning fail-open. Verify the exact endpoint/model before allowing
          # a deployment that could later reach ElevenLabs.
          docker exec "$ENGINE_CID" node -e "const k=process.env.OPENAI_API_KEY,m=process.env.OPENAI_MODERATION_MODEL||'omni-moderation-latest';fetch('https://api.openai.com/v1/moderations',{method:'POST',headers:{Authorization:'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify({model:m,input:'Educational narration moderation deployment check.'})}).then(async r=>{if(!r.ok)throw new Error('OpenAI moderation smoke '+r.status+': '+(await r.text()).slice(0,300));const j=await r.json();if(!j.results?.length||typeof j.results[0].flagged!=='boolean')throw new Error('OpenAI moderation smoke returned an invalid response');console.log('pre-TTS moderation route OK: '+(j.model||m))}).catch(e=>{console.error(e.message);process.exit(1)})"

      - name: Health check
        run: |
          set -e
          check() {
            local name=$1 url=$2 hdr=${3:-}
            local retry=0 max=24
            until curl -sf ${hdr:+-H "$hdr"} "$url" > /dev/null 2>&1; do
              retry=$((retry + 1))
              if [ $retry -ge $max ]; then
                echo "ERROR: $name did not come up after 120s"
                docker compose logs --tail=60 "$name"
                exit 1
              fi
              echo "waiting for $name ... ($retry/$max)"
              sleep 5
            done
            echo "$name OK"
          }
          check long-compose http://127.0.0.1:4001/topic-history
          check engine http://127.0.0.1:4321/api/config "Host: localhost"

      - name: Report
        run: |
          set -e
          echo "=== Active graph and provider wiring ==="
          config=$(curl -sf -H "Host: localhost" http://127.0.0.1:4321/api/config)
          echo "$config" | jq '{graph, providers: [.providers[] | {role, provider, real}]}'
          if ! echo "$config" | jq -e '.providers[] | select(.role == "images" and .real == true and (.provider | startswith("fal/")))' > /dev/null; then
            echo "::error::image stage must be live through fal.ai"
            exit 1
          fi
          if ! echo "$config" | jq -e '.providers[] | select(.role == "speech" and .real == true)' > /dev/null; then exit 1; fi

      - name: Cleanup
        run: |
          docker builder prune -f --keep-storage 20GB
          docker image prune -af --filter "until=168h"
          echo "=== Deploy complete ==="
          docker compose ps

      - name: Disk
        if: always()
        run: |
          df -h / | tail -1
          docker system df
          used=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          if [ "$used" -ge 85 ]; then
            echo "::error::disk is ${used}% full after cleanup — investigate before it fills"
            exit 1
          fi
          echo "disk ${used}% used"

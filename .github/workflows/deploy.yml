name: Deploy to Production

# Deploys VidGen to the self-hosted HP Linux server. Shorts owns the single
# FreeLLMAPI container/volume; Long only joins its runtime network.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Migrate compose project name (yt-longform -> vidgen)
        run: bash scripts/migrate-from-yt-longform.sh

      - name: Build and deploy
        env:
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          LLM_ROUTER_MODE: ${{ vars.LLM_ROUTER_MODE || 'freellmapi' }}
          LLM_ROUTER_FAIL_OPEN_TO_DIRECT: ${{ vars.LLM_ROUTER_FAIL_OPEN_TO_DIRECT || 'true' }}
          LLM_ROUTER_TIMEOUT_MS: ${{ vars.LLM_ROUTER_TIMEOUT_MS || '120000' }}
          FREELLMAPI_TEXT_MODEL: ${{ vars.FREELLMAPI_TEXT_MODEL || 'auto:smart' }}
          FREELLMAPI_VISION_MODEL: ${{ vars.FREELLMAPI_VISION_MODEL || 'auto:smart' }}
          SHARED_LLM_NETWORK: ${{ vars.SHARED_LLM_NETWORK || 'yt-n8n-automation-shorts_default' }}

          IMAGE_PROVIDER_MODE: ${{ vars.IMAGE_PROVIDER_MODE || 'freellmapi' }}
          SPEECH_PROVIDER_MODE: ${{ vars.SPEECH_PROVIDER_MODE || 'freellmapi' }}
          # Media model ids come from FreeLLM's separate media registry. `auto`
          # remains portable only while no separately-metered hero row is
          # enabled; hero escalation requires a concrete standard image model.
          FREELLMAPI_IMAGE_MODEL: ${{ vars.FREELLMAPI_IMAGE_MODEL || 'auto' }}
          FREELLMAPI_SPEECH_MODEL: ${{ vars.FREELLMAPI_SPEECH_MODEL || 'auto' }}
          FREELLMAPI_SPEECH_VOICE: ${{ vars.FREELLMAPI_SPEECH_VOICE || 'onyx' }}
          FREELLMAPI_SPEECH_FORMAT: ${{ vars.FREELLMAPI_SPEECH_FORMAT || 'mp3' }}
          FREELLMAPI_MEDIA_TIMEOUT_MS: ${{ vars.FREELLMAPI_MEDIA_TIMEOUT_MS || '120000' }}
          # Opt-in hero-shot escalation (RFC 0009's 3-5 hero shots only). Empty
          # by default -- deliberately not spent unless an operator sets it.
          FREELLMAPI_HERO_IMAGE_MODEL: ${{ vars.FREELLMAPI_HERO_IMAGE_MODEL || '' }}
          FREELLMAPI_HERO_IMAGE_MAX_CALLS: ${{ vars.FREELLMAPI_HERO_IMAGE_MAX_CALLS || '10' }}
          FREELLMAPI_HERO_IMAGE_PROMPT_MAX_CHARS: ${{ vars.FREELLMAPI_HERO_IMAGE_PROMPT_MAX_CHARS || '1000' }}

          OPENAI_API_KEY: ${{ secrets.OPEN_AI_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          AMOS_ALLOW_PUBLISH: "1"
        run: |
          set -euo pipefail

          # FreeLLM `auto` means every enabled image row in priority order. Once
          # a scarce NVIDIA/custom row is reserved for hero shots, allowing the
          # standard path to stay on auto makes ordinary shots capable of
          # consuming that same quota invisibly. Refuse the deployment before
          # restarting a working engine rather than discovering this mid-run.
          if [ "$IMAGE_PROVIDER_MODE" = "freellmapi" ] && [ -n "${FREELLMAPI_HERO_IMAGE_MODEL:-}" ]; then
            if [ -z "${FREELLMAPI_IMAGE_MODEL:-}" ] || [ "$FREELLMAPI_IMAGE_MODEL" = "auto" ]; then
              echo "::error::FREELLMAPI_HERO_IMAGE_MODEL is enabled, so FREELLMAPI_IMAGE_MODEL must be the exact model_id of the intended standard image row (for example the enabled Sana row), not 'auto'."
              exit 1
            fi
            if [ "$FREELLMAPI_IMAGE_MODEL" = "$FREELLMAPI_HERO_IMAGE_MODEL" ]; then
              echo "::error::FREELLMAPI_IMAGE_MODEL and FREELLMAPI_HERO_IMAGE_MODEL must be different; otherwise ordinary shots consume the hero quota."
              exit 1
            fi
          fi

          echo "=== Building ==="
          docker compose build engine long-compose

          echo "=== Starting ==="
          docker compose up -d --remove-orphans postgres engine long-compose

          echo "=== Attaching engine to shared FreeLLMAPI network ==="
          ENGINE_CID="$(docker compose ps -q engine)"
          if [ -z "$ENGINE_CID" ]; then
            echo "::error::cannot locate running VidGen engine container"
            exit 1
          fi

          FREE_MEDIA_REQUIRED=0
          if [ "$IMAGE_PROVIDER_MODE" = "freellmapi" ] || [ "$SPEECH_PROVIDER_MODE" = "freellmapi" ]; then FREE_MEDIA_REQUIRED=1; fi
          if [ "$FREE_MEDIA_REQUIRED" = "1" ] && [ -z "${FREELLMAPI_API_KEY:-}" ]; then
            echo "::error::FreeLLMAPI media is selected but FREELLMAPI_API_KEY is not configured"
            exit 1
          fi

          if docker network inspect "$SHARED_LLM_NETWORK" >/dev/null 2>&1; then
            if ! docker inspect -f '{{json .NetworkSettings.Networks}}' "$ENGINE_CID" | grep -Fq "\"$SHARED_LLM_NETWORK\""; then
              docker network connect "$SHARED_LLM_NETWORK" "$ENGINE_CID"
            fi
            docker exec "$ENGINE_CID" node -e "fetch('http://freellmapi:3001/api/ping').then(r=>{if(!r.ok)throw Error(String(r.status));console.log('shared FreeLLMAPI reachable')}).catch(e=>{console.error(e.message);process.exit(1)})" || {
              if [ "$FREE_MEDIA_REQUIRED" = "1" ]; then exit 1; fi
              echo "::warning::shared FreeLLMAPI unavailable; reasoning may use direct fail-open"
            }
          elif [ "$FREE_MEDIA_REQUIRED" = "1" ]; then
            echo "::error::FreeLLMAPI media is selected but shared network $SHARED_LLM_NETWORK is absent"
            exit 1
          fi

          if [ "${LLM_ROUTER_MODE}" != "direct" ] && [ -z "${FREELLMAPI_API_KEY:-}" ]; then
            echo "::warning::FREELLMAPI_API_KEY is not configured for reasoning; direct OpenAI fail-open will be used"
          fi

          # Do not call /api/media here. v0.9.5 protects dashboard/admin routes
          # with a dashboard session token; FREELLMAPI_API_KEY authorizes only
          # /v1 inference. Long validates media through the same inference API
          # production will use and never bypasses the Shorts-owned admin state.
          if [ "$IMAGE_PROVIDER_MODE" = "freellmapi" ]; then
            docker exec "$ENGINE_CID" node -e "const k=process.env.FREELLMAPI_API_KEY,m=process.env.FREELLMAPI_IMAGE_MODEL||'auto';fetch('http://freellmapi:3001/v1/images/generations',{method:'POST',headers:{Authorization:'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify({model:m,prompt:'simple empty landscape, no text',n:1,size:'512x512',response_format:'b64_json'})}).then(async r=>{if(!r.ok){const body=(await r.text()).slice(0,300);if(r.status===502&&/no usable keys/i.test(body))throw new Error('image smoke 502: no usable image provider is enabled. In the shared FreeLLMAPI dashboard open Models -> Image and enable a standard image row, then set FREELLMAPI_IMAGE_MODEL to that row model_id and redeploy.');throw new Error('image smoke '+r.status+': '+body)}const j=await r.json();if(!j.data?.length)throw new Error('image smoke empty');console.log('FreeLLMAPI image smoke OK: '+(j.provider||'registry')+'/'+(j.model||m))}).catch(e=>{console.error(e.message);process.exit(1)})"
          fi

          # `auto` is live-proven on the shared instance. Google currently
          # returns WAV despite an MP3 preference; that is valid and the engine
          # persists the real media type instead of rejecting it.
          if [ "$SPEECH_PROVIDER_MODE" = "freellmapi" ]; then
            docker exec "$ENGINE_CID" node -e "const k=process.env.FREELLMAPI_API_KEY,m=process.env.FREELLMAPI_SPEECH_MODEL||'auto',v=process.env.FREELLMAPI_SPEECH_VOICE||'onyx';fetch('http://freellmapi:3001/v1/audio/speech',{method:'POST',headers:{Authorization:'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify({model:m,input:'Media smoke test.',voice:v,response_format:'mp3'})}).then(async r=>{if(!r.ok)throw new Error('speech smoke '+r.status+': '+(await r.text()).slice(0,300));const b=await r.arrayBuffer();if(!b.byteLength)throw new Error('speech smoke empty');const t=(r.headers.get('content-type')||'').split(';')[0].toLowerCase();if(!['audio/wav','audio/x-wav','audio/vnd.wave','audio/wave','audio/mpeg','audio/mp3','audio/ogg','audio/aac','audio/flac','audio/l16'].includes(t))throw new Error('unsupported speech content-type '+t);console.log('FreeLLMAPI speech smoke OK: '+(r.headers.get('x-provider')||'unknown')+'/'+m+' '+t+' '+b.byteLength+' bytes')}).catch(e=>{console.error(e.message);process.exit(1)})"
          fi

      - name: Health check
        run: |
          set -e
          check() {
            local name=$1 url=$2 hdr=${3:-}
            local retry=0 max=24
            until curl -sf ${hdr:+-H "$hdr"} "$url" > /dev/null 2>&1; do
              retry=$((retry + 1))
              if [ $retry -ge $max ]; then
                echo "ERROR: $name did not come up after 120s"
                docker compose logs --tail=60 "$name"
                exit 1
              fi
              echo "waiting for $name ... ($retry/$max)"
              sleep 5
            done
            echo "$name OK"
          }
          check long-compose http://127.0.0.1:4001/topic-history
          check engine http://127.0.0.1:4321/api/config "Host: localhost"

      - name: Report
        run: |
          set -e
          echo "=== Active graph and provider wiring ==="
          config=$(curl -sf -H "Host: localhost" http://127.0.0.1:4321/api/config)
          echo "$config" | jq '{graph, providers: [.providers[] | {role, provider, real}]}'
          if ! echo "$config" | jq -e '.providers[] | select(.role == "images" and .real == true)' > /dev/null; then exit 1; fi
          if ! echo "$config" | jq -e '.providers[] | select(.role == "speech" and .real == true)' > /dev/null; then exit 1; fi

      - name: Cleanup
        run: |
          docker builder prune -f --keep-storage 20GB
          docker image prune -af --filter "until=168h"
          echo "=== Deploy complete ==="
          docker compose ps

      - name: Disk
        if: always()
        run: |
          df -h / | tail -1
          docker system df
          used=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          if [ "$used" -ge 85 ]; then
            echo "::error::disk is ${used}% full after cleanup — investigate before it fills"
            exit 1
          fi
          echo "disk ${used}% used"

name: Deploy to Production

# Deploys VidGen to the self-hosted HP Linux server (the same box the Shorts
# stack runs on). Ports are offset from that stack on purpose:
#
#   VidGen engine       127.0.0.1:4321
#   VidGen long-compose 127.0.0.1:4001    (Shorts uses 4000)
#   legacy n8n          127.0.0.1:5679    (Shorts uses 5678) — not started here
#
# Shorts owns the one FreeLLMAPI container/volume. Long attaches only its engine
# container to the Shorts runtime network and can use that shared service for
# reasoning, vision QA, and (experimentally) image + speech generation.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Migrate compose project name (yt-longform -> vidgen)
        run: bash scripts/migrate-from-yt-longform.sh

      - name: Build and deploy
        env:
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          LLM_ROUTER_MODE: ${{ vars.LLM_ROUTER_MODE || 'freellmapi' }}
          LLM_ROUTER_FAIL_OPEN_TO_DIRECT: ${{ vars.LLM_ROUTER_FAIL_OPEN_TO_DIRECT || 'true' }}
          LLM_ROUTER_TIMEOUT_MS: ${{ vars.LLM_ROUTER_TIMEOUT_MS || '120000' }}
          FREELLMAPI_TEXT_MODEL: ${{ vars.FREELLMAPI_TEXT_MODEL || 'auto:smart' }}
          FREELLMAPI_VISION_MODEL: ${{ vars.FREELLMAPI_VISION_MODEL || 'auto:smart' }}
          SHARED_LLM_NETWORK: ${{ vars.SHARED_LLM_NETWORK || 'yt-n8n-automation-shorts_default' }}

          # Experimental media defaults. Set IMAGE_PROVIDER_MODE=fal and/or
          # SPEECH_PROVIDER_MODE=elevenlabs for immediate rollback on redeploy.
          IMAGE_PROVIDER_MODE: ${{ vars.IMAGE_PROVIDER_MODE || 'freellmapi' }}
          SPEECH_PROVIDER_MODE: ${{ vars.SPEECH_PROVIDER_MODE || 'freellmapi' }}
          FREELLMAPI_IMAGE_MODEL: ${{ vars.FREELLMAPI_IMAGE_MODEL || 'flux' }}
          FREELLMAPI_SPEECH_MODEL: ${{ vars.FREELLMAPI_SPEECH_MODEL || 'openai-audio' }}
          FREELLMAPI_SPEECH_VOICE: ${{ vars.FREELLMAPI_SPEECH_VOICE || 'onyx' }}
          FREELLMAPI_SPEECH_FORMAT: ${{ vars.FREELLMAPI_SPEECH_FORMAT || 'mp3' }}
          FREELLMAPI_MEDIA_TIMEOUT_MS: ${{ vars.FREELLMAPI_MEDIA_TIMEOUT_MS || '120000' }}

          # Existing paid providers remain configured for config-only rollback.
          OPENAI_API_KEY: ${{ secrets.OPEN_AI_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          AMOS_ALLOW_PUBLISH: "1"
        run: |
          set -euo pipefail

          echo "=== Building ==="
          docker compose build engine long-compose

          echo "=== Starting ==="
          docker compose up -d --remove-orphans postgres engine long-compose

          echo "=== Attaching engine to shared FreeLLMAPI network ==="
          ENGINE_CID="$(docker compose ps -q engine)"
          if [ -z "$ENGINE_CID" ]; then
            echo "::error::cannot locate running VidGen engine container"
            exit 1
          fi

          FREE_MEDIA_REQUIRED=0
          if [ "$IMAGE_PROVIDER_MODE" = "freellmapi" ] || [ "$SPEECH_PROVIDER_MODE" = "freellmapi" ]; then
            FREE_MEDIA_REQUIRED=1
          fi

          if [ "$FREE_MEDIA_REQUIRED" = "1" ] && [ -z "${FREELLMAPI_API_KEY:-}" ]; then
            echo "::error::FreeLLMAPI media is selected but FREELLMAPI_API_KEY is not configured"
            exit 1
          fi

          if docker network inspect "$SHARED_LLM_NETWORK" >/dev/null 2>&1; then
            if docker inspect -f '{{json .NetworkSettings.Networks}}' "$ENGINE_CID" | grep -Fq "\"$SHARED_LLM_NETWORK\""; then
              echo "engine already attached to $SHARED_LLM_NETWORK"
            else
              docker network connect "$SHARED_LLM_NETWORK" "$ENGINE_CID"
              echo "engine attached to $SHARED_LLM_NETWORK"
            fi

            if docker exec "$ENGINE_CID" node -e "fetch('http://freellmapi:3001/api/ping').then(r=>{if(!r.ok)process.exit(1);return r.text()}).then(()=>console.log('shared FreeLLMAPI reachable')).catch(()=>process.exit(1))"; then
              echo "shared FreeLLMAPI network path OK"
            elif [ "$FREE_MEDIA_REQUIRED" = "1" ]; then
              echo "::error::FreeLLMAPI media is selected but the engine cannot reach the shared service"
              exit 1
            else
              echo "::warning::engine cannot currently reach shared FreeLLMAPI; reasoning may use configured direct fail-open"
            fi
          elif [ "$FREE_MEDIA_REQUIRED" = "1" ]; then
            echo "::error::FreeLLMAPI media is selected but shared network $SHARED_LLM_NETWORK is absent"
            exit 1
          else
            echo "::warning::shared network $SHARED_LLM_NETWORK is absent; reasoning may use direct LLM fail-open"
          fi

          if [ "${LLM_ROUTER_MODE}" != "direct" ] && [ -z "${FREELLMAPI_API_KEY:-}" ]; then
            echo "::warning::FREELLMAPI_API_KEY is not configured for reasoning; direct OpenAI fail-open will be used"
          fi

          # Exercise the exact selected media endpoints before declaring the
          # deployment healthy. These are tiny free-tier smoke calls and do not
          # log the unified key or generated media.
          if [ "$IMAGE_PROVIDER_MODE" = "freellmapi" ]; then
            docker exec "$ENGINE_CID" node -e "const k=process.env.FREELLMAPI_API_KEY,m=process.env.FREELLMAPI_IMAGE_MODEL||'flux';fetch('http://freellmapi:3001/v1/images/generations',{method:'POST',headers:{Authorization:'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify({model:m,prompt:'simple empty landscape, no text',n:1,size:'512x512',response_format:'b64_json'})}).then(async r=>{if(!r.ok)throw new Error('image smoke '+r.status);const j=await r.json();if(!j.data?.length)throw new Error('image smoke empty');console.log('FreeLLMAPI image smoke OK: '+(j.provider||'unknown')+'/'+(j.model||m))}).catch(e=>{console.error(e.message);process.exit(1)})"
          fi

          if [ "$SPEECH_PROVIDER_MODE" = "freellmapi" ]; then
            docker exec "$ENGINE_CID" node -e "const k=process.env.FREELLMAPI_API_KEY,m=process.env.FREELLMAPI_SPEECH_MODEL||'openai-audio',v=process.env.FREELLMAPI_SPEECH_VOICE||'onyx';fetch('http://freellmapi:3001/v1/audio/speech',{method:'POST',headers:{Authorization:'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify({model:m,input:'Media smoke test.',voice:v,response_format:'mp3'})}).then(async r=>{if(!r.ok)throw new Error('speech smoke '+r.status);const b=await r.arrayBuffer();if(!b.byteLength)throw new Error('speech smoke empty');console.log('FreeLLMAPI speech smoke OK: '+(r.headers.get('x-provider')||'unknown')+'/'+m)}).catch(e=>{console.error(e.message);process.exit(1)})"
          fi

      - name: Health check
        run: |
          set -e
          check() {
            local name=$1 url=$2 hdr=${3:-}
            local retry=0 max=24
            until curl -sf ${hdr:+-H "$hdr"} "$url" > /dev/null 2>&1; do
              retry=$((retry + 1))
              if [ $retry -ge $max ]; then
                echo "ERROR: $name did not come up after 120s"
                docker compose logs --tail=60 "$name"
                exit 1
              fi
              echo "waiting for $name ... ($retry/$max)"
              sleep 5
            done
            echo "$name OK"
          }

          check long-compose http://127.0.0.1:4001/topic-history
          check engine http://127.0.0.1:4321/api/config "Host: localhost"

      - name: Report
        run: |
          set -e
          echo "=== Active graph and provider wiring ==="
          config=$(curl -sf -H "Host: localhost" http://127.0.0.1:4321/api/config)
          echo "$config" | jq '{graph, providers: [.providers[] | {role, provider, real}]}'

          if ! echo "$config" | jq -e '.providers[] | select(.role == "images" and .real == true)' > /dev/null; then
            echo "::error::selected image provider is not live after deploy"
            exit 1
          fi
          if ! echo "$config" | jq -e '.providers[] | select(.role == "speech" and .real == true)' > /dev/null; then
            echo "::error::selected speech provider is not live after deploy"
            exit 1
          fi

      - name: Cleanup
        run: |
          docker builder prune -f --keep-storage 20GB
          docker image prune -af --filter "until=168h"

          echo "=== Deploy complete ==="
          docker compose ps

      - name: Disk
        if: always()
        run: |
          df -h / | tail -1
          docker system df
          used=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          if [ "$used" -ge 85 ]; then
            echo "::error::disk is ${used}% full after cleanup — investigate before it fills"
            exit 1
          fi
          echo "disk ${used}% used"

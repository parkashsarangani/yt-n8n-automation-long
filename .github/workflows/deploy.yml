name: Deploy to Production

# Deploys VidGen to the self-hosted HP Linux server. Shorts owns the single
# FreeLLMAPI container/volume; Long joins its runtime network for pinned text.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Migrate compose project name (yt-longform -> vidgen)
        run: bash scripts/migrate-from-yt-longform.sh

      - name: Build and deploy
        env:
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          LLM_ROUTER_MODE: ${{ vars.LLM_ROUTER_MODE || 'freellmapi' }}
          LLM_ROUTER_TIMEOUT_MS: ${{ vars.LLM_ROUTER_TIMEOUT_MS || '120000' }}
          # Ordered chain of concrete free models. Empty = engine built-in default.
          # There is no paid text fallback; auto / auto:* is rejected.
          FREELLMAPI_TEXT_MODELS: ${{ vars.FREELLMAPI_TEXT_MODELS || '' }}
          # proxy (default): free text-only visual QA, zero paid vision.
          VISUAL_QA_MODE: ${{ vars.VISUAL_QA_MODE || 'proxy' }}
          SHARED_LLM_NETWORK: ${{ vars.SHARED_LLM_NETWORK || 'yt-n8n-automation-shorts_default' }}

          SPEECH_PROVIDER_MODE: elevenlabs
          OPENAI_API_KEY: ${{ secrets.OPEN_AI_KEY }}
          OPENAI_IMAGE_QA_MODEL: ${{ vars.OPENAI_IMAGE_QA_MODEL || vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
          OPENAI_MODERATION_MODEL: ${{ vars.OPENAI_MODERATION_MODEL || 'omni-moderation-latest' }}
          TTS_MODERATION_TIMEOUT_MS: ${{ vars.TTS_MODERATION_TIMEOUT_MS || '30000' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

          # RFC 0010 generation. Images and premium text-to-video are direct fal;
          # no FreeLLM image model or image fallback exists in Long.
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FAL_MODEL: ${{ vars.FAL_MODEL || 'fal-ai/flux-2' }}
          FAL_EDIT_MODEL: ${{ vars.FAL_EDIT_MODEL || '' }}
          FAL_TEXT_TO_VIDEO_MODEL: ${{ vars.FAL_TEXT_TO_VIDEO_MODEL || 'fal-ai/kling-video/v2.5-turbo/pro/text-to-video' }}
          FAL_PRICE_PER_IMAGE: ${{ vars.FAL_PRICE_PER_IMAGE || '' }}

          # Free-first image / video generation via the shared FreeLLMAPI media
          # gateway. Empty lists = no free route. For images the paid fal
          # generator is the last resort (PAID_IMAGE_FALLBACK). For video there
          # is NO paid fallback: FREELLMAPI_VIDEO_MODELS is a FREE-only allowlist
          # and PAID_VIDEO_FALLBACK is hard-off by default.
          FREELLMAPI_IMAGE_MODELS: ${{ vars.FREELLMAPI_IMAGE_MODELS || '' }}
          FREELLMAPI_IMAGE_PROMPT_MAX: ${{ vars.FREELLMAPI_IMAGE_PROMPT_MAX || '' }}
          FREELLMAPI_VIDEO_MODELS: ${{ vars.FREELLMAPI_VIDEO_MODELS || '' }}
          FREELLMAPI_VIDEO_DURATION_SEC: ${{ vars.FREELLMAPI_VIDEO_DURATION_SEC || '' }}

          # Capability-specific free-first fallback policy (four booleans).
          PAID_TEXT_FALLBACK: ${{ vars.PAID_TEXT_FALLBACK || 'true' }}
          PAID_VISION_FALLBACK: ${{ vars.PAID_VISION_FALLBACK || 'true' }}
          PAID_IMAGE_FALLBACK: ${{ vars.PAID_IMAGE_FALLBACK || 'true' }}
          PAID_VIDEO_FALLBACK: ${{ vars.PAID_VIDEO_FALLBACK || 'false' }}
          FREE_VISION_MODELS: ${{ vars.FREE_VISION_MODELS || '' }}

          # RFC 0010 stock candidates. The resolver downloads and frame-verifies
          # the actual clips before using an exact selected segment.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          AMOS_ALLOW_PUBLISH: "1"
        run: |
          set -euo pipefail

          for list_name in FREELLMAPI_TEXT_MODELS FREELLMAPI_IMAGE_MODELS FREELLMAPI_VIDEO_MODELS; do
            eval "list_val=\${$list_name:-}"
            if printf '%s' "$list_val" | grep -qiE '(^|,)[[:space:]]*auto(:|[[:space:]]*(,|$))'; then
              echo "::error::$list_name may not contain auto routing; pin concrete model ids"
              exit 1
            fi
          done
          if [ "${VISUAL_QA_MODE}" = "real" ]; then
            echo "::error::VISUAL_QA_MODE=real would incur paid OpenAI vision on production runs"
            exit 1
          fi
          # Image generation needs a fal key OR a free-first FreeLLMAPI image chain.
          if [ -z "${FAL_KEY:-}" ] && [ -z "${FREELLMAPI_IMAGE_MODELS:-}" ]; then
            echo "::error::image generation needs FAL_KEY or FREELLMAPI_IMAGE_MODELS (free-first image generation)"
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is required for authoritative visual QA and pre-TTS moderation"
            exit 1
          fi

          echo "=== Building ==="
          docker compose build engine long-compose

          echo "=== Starting ==="
          docker compose up -d --remove-orphans postgres engine long-compose

          echo "=== Attaching engine to shared FreeLLMAPI network ==="
          ENGINE_CID="$(docker compose ps -q engine)"
          if [ -z "$ENGINE_CID" ]; then
            echo "::error::cannot locate running VidGen engine container"
            exit 1
          fi

          if docker network inspect "$SHARED_LLM_NETWORK" >/dev/null 2>&1; then
            if ! docker inspect -f '{{json .NetworkSettings.Networks}}' "$ENGINE_CID" | grep -Fq "\"$SHARED_LLM_NETWORK\""; then
              docker network connect "$SHARED_LLM_NETWORK" "$ENGINE_CID"
            fi
            docker exec "$ENGINE_CID" node -e "fetch('http://freellmapi:3001/api/ping').then(r=>{if(!r.ok)throw Error(String(r.status));console.log('shared FreeLLMAPI reachable')}).catch(e=>{console.error(e.message);process.exit(1)})" || {
              if [ "${LLM_ROUTER_MODE}" != "direct" ]; then
                echo "::error::shared FreeLLMAPI is unreachable and there is no paid text fallback"
                exit 1
              fi
              echo "::warning::shared FreeLLMAPI unreachable; LLM_ROUTER_MODE=direct will use paid OpenAI (manual rollback)"
            }
          elif [ "${LLM_ROUTER_MODE}" != "direct" ]; then
            echo "::error::freellmapi reasoning is selected but shared network $SHARED_LLM_NETWORK is absent"
            exit 1
          fi

          if [ "${LLM_ROUTER_MODE}" != "direct" ] && [ -z "${FREELLMAPI_API_KEY:-}" ]; then
            echo "::error::FREELLMAPI_API_KEY is required for reasoning; there is no paid text fallback"
            exit 1
          fi

          # Prove the free text chain can actually serve a completion, not
          # just answer /api/ping. Mirrors production: try each configured
          # free model in order; the deploy passes if ANY responds and
          # fails only if EVERY model is unavailable (no paid fallback).
          if [ "${LLM_ROUTER_MODE}" != "direct" ]; then
            docker exec "$ENGINE_CID" node -e "const key=process.env.FREELLMAPI_API_KEY;const models=(process.env.FREELLMAPI_TEXT_MODELS||'gpt-oss-120b,llama-3.3-70b-fp8-fast,nemotron-3-super-120b,gpt-oss-20b').split(',').map(x=>x.trim()).filter(Boolean);(async()=>{const errs=[];for(const m of models){try{const r=await fetch('http://freellmapi:3001/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model:m,messages:[{role:'user',content:'Reply with exactly: OK'}],max_completion_tokens:16})});const b=await r.text();if(!r.ok){errs.push(m+': HTTP '+r.status+' '+b.slice(0,140).replace(/\\s+/g,' '));continue}const j=JSON.parse(b);if(!j.choices||!j.choices.length){errs.push(m+': no choices');continue}console.log('free text chain OK via '+(j.model||m));process.exit(0)}catch(e){errs.push(m+': '+((e&&e.message)||e))}}console.error('every configured free text model is unavailable:\\n  '+errs.join('\\n  '));process.exit(1)})()"
          fi

          # Pre-TTS moderation is a hard production dependency. Verify the
          # exact endpoint/model before allowing a deployment that could
          # later reach ElevenLabs.
          docker exec "$ENGINE_CID" node -e "const k=process.env.OPENAI_API_KEY,m=process.env.OPENAI_MODERATION_MODEL||'omni-moderation-latest';fetch('https://api.openai.com/v1/moderations',{method:'POST',headers:{Authorization:'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify({model:m,input:'Educational narration moderation deployment check.'})}).then(async r=>{if(!r.ok)throw new Error('OpenAI moderation smoke '+r.status+': '+(await r.text()).slice(0,300));const j=await r.json();if(!j.results?.length||typeof j.results[0].flagged!=='boolean')throw new Error('OpenAI moderation smoke returned an invalid response');console.log('pre-TTS moderation route OK: '+(j.model||m))}).catch(e=>{console.error(e.message);process.exit(1)})"

      - name: Health check
        run: |
          set -e
          check() {
            local name=$1 url=$2 hdr=${3:-}
            local retry=0 max=24
            until curl -sf ${hdr:+-H "$hdr"} "$url" > /dev/null 2>&1; do
              retry=$((retry + 1))
              if [ $retry -ge $max ]; then
                echo "ERROR: $name did not come up after 120s"
                docker compose logs --tail=60 "$name"
                exit 1
              fi
              echo "waiting for $name ... ($retry/$max)"
              sleep 5
            done
            echo "$name OK"
          }
          check long-compose http://127.0.0.1:4001/topic-history
          check engine http://127.0.0.1:4321/api/config "Host: localhost"

      - name: Report
        run: |
          set -e
          echo "=== Active graph and provider wiring ==="
          config=$(curl -sf -H "Host: localhost" http://127.0.0.1:4321/api/config)
          echo "$config" | jq '{graph, providers: [.providers[] | {role, provider, real}]}'
          # The image stage must be live through fal OR the free-first FreeLLMAPI
          # media gateway (its provider string contains "freellmapi media").
          if ! echo "$config" | jq -e '.providers[] | select(.role == "images" and .real == true and (.provider | test("fal/|freellmapi media")))' > /dev/null; then
            echo "::error::image stage must be live (fal or free-first FreeLLMAPI media)"
            exit 1
          fi
          if ! echo "$config" | jq -e '.providers[] | select(.role == "speech" and .real == true)' > /dev/null; then exit 1; fi

      - name: Cleanup
        run: |
          docker builder prune -f --keep-storage 20GB
          docker image prune -af --filter "until=168h"
          echo "=== Deploy complete ==="
          docker compose ps

      - name: Disk
        if: always()
        run: |
          df -h / | tail -1
          docker system df
          used=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          if [ "$used" -ge 85 ]; then
            echo "::error::disk is ${used}% full after cleanup — investigate before it fills"
            exit 1
          fi
          echo "disk ${used}% used"

name: Deploy to Production

# Deploys VidGen to the self-hosted HP Linux server. Shorts owns the single
# FreeLLMAPI container/volume; Long joins its runtime network for free-first text.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Migrate compose project name (yt-longform -> vidgen)
        run: bash scripts/migrate-from-yt-longform.sh

      - name: Build and deploy
        env:
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          LLM_ROUTER_MODE: ${{ vars.LLM_ROUTER_MODE || 'freellmapi' }}
          LLM_ROUTER_TIMEOUT_MS: ${{ vars.LLM_ROUTER_TIMEOUT_MS || '120000' }}
          # Ordered chain of concrete free models. Empty = engine built-in default.
          # `auto` / `auto:*` is rejected; paid text is a last resort only when
          # PAID_TEXT_FALLBACK=true and the free chain cannot serve the request.
          FREELLMAPI_TEXT_MODELS: ${{ vars.FREELLMAPI_TEXT_MODELS || '' }}
          SHARED_LLM_NETWORK: ${{ vars.SHARED_LLM_NETWORK || 'yt-n8n-automation-shorts_default' }}

          OPENAI_API_KEY: ${{ secrets.OPEN_AI_KEY }}
          OPENAI_MODERATION_MODEL: ${{ vars.OPENAI_MODERATION_MODEL || 'omni-moderation-latest' }}
          TTS_MODERATION_TIMEOUT_MS: ${{ vars.TTS_MODERATION_TIMEOUT_MS || '30000' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Operator-selected narrator; voice IDs are public identifiers, not credentials.
          ELEVENLABS_VOICE_ID: gZiz6WFdAxF6MKJ0s5s6
          ELEVENLABS_SPEED: ${{ vars.ELEVENLABS_SPEED || '0.9' }}

          # Optional custom thumbnail artwork.
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FAL_MODEL: ${{ vars.FAL_MODEL || 'fal-ai/flux-2' }}
          FAL_PRICE_PER_IMAGE: ${{ vars.FAL_PRICE_PER_IMAGE || '' }}

          PAID_TEXT_FALLBACK: ${{ vars.PAID_TEXT_FALLBACK || 'true' }}

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          AMOS_ALLOW_PUBLISH: "1"
        run: |
          set -euo pipefail

          paid_text_ready() {
            [ "${PAID_TEXT_FALLBACK:-false}" = "true" ] && [ -n "${OPENAI_API_KEY:-}" ]
          }

          for list_name in FREELLMAPI_TEXT_MODELS; do
            eval "list_val=\${$list_name:-}"
            if printf '%s' "$list_val" | grep -qiE '(^|,)[[:space:]]*auto(:|[[:space:]]*(,|$))'; then
              echo "::error::$list_name may not contain auto routing; pin concrete model ids"
              exit 1
            fi
          done
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is required for pre-TTS moderation"
            exit 1
          fi

          echo "=== Building ==="
          docker compose build engine long-compose

          echo "=== Starting ==="
          docker compose up -d --remove-orphans postgres engine long-compose

          echo "=== Attaching engine to shared FreeLLMAPI network ==="
          ENGINE_CID="$(docker compose ps -q engine)"
          if [ -z "$ENGINE_CID" ]; then
            echo "::error::cannot locate running VidGen engine container"
            exit 1
          fi

          FREE_LLM_REACHABLE=0
          if docker network inspect "$SHARED_LLM_NETWORK" >/dev/null 2>&1; then
            if ! docker inspect -f '{{json .NetworkSettings.Networks}}' "$ENGINE_CID" | grep -Fq "\"$SHARED_LLM_NETWORK\""; then
              docker network connect "$SHARED_LLM_NETWORK" "$ENGINE_CID"
            fi
            if docker exec "$ENGINE_CID" node -e "fetch('http://freellmapi:3001/api/ping').then(r=>{if(!r.ok)throw Error(String(r.status));console.log('shared FreeLLMAPI reachable')}).catch(e=>{console.error(e.message);process.exit(1)})"; then
              FREE_LLM_REACHABLE=1
            elif [ "${LLM_ROUTER_MODE}" != "direct" ]; then
              if paid_text_ready; then
                echo "::warning::shared FreeLLMAPI is unreachable; runtime will use paid OpenAI text fallback where policy allows"
              else
                echo "::error::shared FreeLLMAPI is unreachable and no paid text fallback is available"
                exit 1
              fi
            fi
          elif [ "${LLM_ROUTER_MODE}" != "direct" ]; then
            if paid_text_ready; then
              echo "::warning::shared network $SHARED_LLM_NETWORK is absent; runtime will use paid OpenAI text fallback"
            else
              echo "::error::freellmapi reasoning is selected but shared network $SHARED_LLM_NETWORK is absent and no paid fallback is available"
              exit 1
            fi
          fi

          if [ "${LLM_ROUTER_MODE}" != "direct" ] && [ -z "${FREELLMAPI_API_KEY:-}" ]; then
            if paid_text_ready; then
              echo "::warning::FREELLMAPI_API_KEY is absent; runtime will use paid OpenAI text fallback"
            else
              echo "::error::FREELLMAPI_API_KEY is required when no paid text fallback is available"
              exit 1
            fi
          fi

          # Prove the free text chain can serve an ordinary completion when the
          # shared route is configured. The runtime independently filters known
          # retired ids and uses capability-aware routing for large structured
          # outputs. A free-chain outage is deploy-safe only when paid fallback
          # is explicitly enabled and credentialed.
          if [ "${LLM_ROUTER_MODE}" != "direct" ] && [ "$FREE_LLM_REACHABLE" -eq 1 ] && [ -n "${FREELLMAPI_API_KEY:-}" ]; then
            if ! docker exec "$ENGINE_CID" node -e "const key=process.env.FREELLMAPI_API_KEY;const retired=new Set(['gpt-oss-120b']);const models=(process.env.FREELLMAPI_TEXT_MODELS||'llama-3.3-70b-fp8-fast,nemotron-3-super-120b,gpt-oss-20b').split(',').map(x=>x.trim()).filter(Boolean).filter(x=>!retired.has(x));(async()=>{const errs=[];for(const m of models){try{const r=await fetch('http://freellmapi:3001/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model:m,messages:[{role:'user',content:'Reply with exactly: OK'}],max_completion_tokens:16})});const b=await r.text();if(!r.ok){errs.push(m+': HTTP '+r.status+' '+b.slice(0,140).replace(/\\s+/g,' '));continue}const j=JSON.parse(b);if(!j.choices||!j.choices.length){errs.push(m+': no choices');continue}console.log('free text chain OK via '+(j.model||m));process.exit(0)}catch(e){errs.push(m+': '+((e&&e.message)||e))}}console.error('every serviceable configured free text model is unavailable:\\n  '+errs.join('\\n  '));process.exit(1)})()"; then
              if paid_text_ready; then
                echo "::warning::free text smoke exhausted all serviceable models; production will use paid OpenAI fallback until free capacity recovers"
              else
                echo "::error::free text chain is unavailable and no paid text fallback is available"
                exit 1
              fi
            fi
          fi

          # Pre-TTS moderation is a hard production dependency. Verify the
          # exact endpoint/model before allowing a deployment that could
          # later reach ElevenLabs.
          docker exec "$ENGINE_CID" node -e "const k=process.env.OPENAI_API_KEY,m=process.env.OPENAI_MODERATION_MODEL||'omni-moderation-latest';fetch('https://api.openai.com/v1/moderations',{method:'POST',headers:{Authorization:'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify({model:m,input:'Educational narration moderation deployment check.'})}).then(async r=>{if(!r.ok)throw new Error('OpenAI moderation smoke '+r.status+': '+(await r.text()).slice(0,300));const j=await r.json();if(!j.results?.length||typeof j.results[0].flagged!=='boolean')throw new Error('OpenAI moderation smoke returned an invalid response');console.log('pre-TTS moderation route OK: '+(j.model||m))}).catch(e=>{console.error(e.message);process.exit(1)})"

      - name: Health check
        run: |
          set -e
          check() {
            local name=$1 url=$2 hdr=${3:-}
            local retry=0 max=24
            until curl -sf ${hdr:+-H "$hdr"} "$url" > /dev/null 2>&1; do
              retry=$((retry + 1))
              if [ $retry -ge $max ]; then
                echo "ERROR: $name did not come up after 120s"
                docker compose logs --tail=60 "$name"
                exit 1
              fi
              echo "waiting for $name ... ($retry/$max)"
              sleep 5
            done
            echo "$name OK"
          }
          check long-compose http://127.0.0.1:4001/topic-history
          check engine http://127.0.0.1:4321/api/config "Host: localhost"

      - name: Report
        run: |
          set -e
          echo "=== Active graph and provider wiring ==="
          config=$(curl -sf -H "Host: localhost" http://127.0.0.1:4321/api/config)
          echo "$config" | jq '{graph, providers: [.providers[] | {role, provider, real}]}'
          if ! echo "$config" | jq -e '.providers[] | select(.role == "speech" and .real == true)' > /dev/null; then exit 1; fi

      - name: Cleanup
        run: |
          docker builder prune -f --keep-storage 20GB
          docker image prune -af --filter "until=168h"
          echo "=== Deploy complete ==="
          docker compose ps

      - name: Disk
        if: always()
        run: |
          df -h / | tail -1
          docker system df
          used=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          if [ "$used" -ge 85 ]; then
            echo "::error::disk is ${used}% full after cleanup — investigate before it fills"
            exit 1
          fi
          echo "disk ${used}% used"

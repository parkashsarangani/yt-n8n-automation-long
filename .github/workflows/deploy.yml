name: Deploy to Production

# Deploys VidGen to the self-hosted HP Linux server (the same box the Shorts
# stack runs on). Ports are offset from that stack on purpose:
#
#   VidGen engine      127.0.0.1:4321
#   VidGen long-compose 127.0.0.1:4001    (Shorts uses 4000)
#   legacy n8n        127.0.0.1:5679    (Shorts uses 5678) — not started here
#
# The UI is loopback-bound and unauthenticated. Reach it from a laptop with an
# SSH tunnel, never by publishing the port. See README "Running on the server".

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      # One-time move from the pre-VidGen compose project name. Idempotent: a
      # no-op on every deploy after the first.
      - name: Migrate compose project name (yt-longform -> vidgen)
        run: bash scripts/migrate-from-yt-longform.sh

      - name: Build and deploy
        env:
          # Unset secrets arrive as empty strings, which the engine treats as
          # "not configured". FAL_KEY is required for production cartoon
          # thumbnails and is asserted again after deployment below.
          # The repo secret is named OPEN_AI_KEY (not OPENAI_API_KEY) --
          # matches whatever name was actually created; the env var the
          # engine reads is OPENAI_API_KEY regardless of the secret's name.
          OPENAI_API_KEY: ${{ secrets.OPEN_AI_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          # Publishing enabled. Uploads are always PRIVATE regardless.
          AMOS_ALLOW_PUBLISH: "1"
        run: |
          set -e

          echo "=== Building ==="
          # Layer cache kept: npm ci only reruns when package*.json changes.
          docker compose build engine long-compose

          echo "=== Starting ==="
          # up -d recreates changed services and leaves the rest alone. The
          # legacy n8n profile is not included, so it stays down.
          # Postgres uses a stock image (no build needed) but must be up first.
          docker compose up -d --remove-orphans postgres engine long-compose

      - name: Health check
        run: |
          set -e
          check() {
            local name=$1 url=$2 hdr=${3:-}
            local retry=0 max=24
            until curl -sf ${hdr:+-H "$hdr"} "$url" > /dev/null 2>&1; do
              retry=$((retry + 1))
              if [ $retry -ge $max ]; then
                echo "ERROR: $name did not come up after 120s"
                docker compose logs --tail=60 "$name"
                exit 1
              fi
              echo "waiting for $name ... ($retry/$max)"
              sleep 5
            done
            echo "$name OK"
          }

          check long-compose http://127.0.0.1:4001/topic-history
          # The Host header matters: the UI refuses any request that did not
          # arrive at localhost, and curl would otherwise send "127.0.0.1".
          check engine http://127.0.0.1:4321/api/config "Host: localhost"

      - name: Report
        run: |
          set -e
          echo "=== Active graph and provider wiring ==="
          config=$(curl -sf -H "Host: localhost" http://127.0.0.1:4321/api/config)
          echo "$config" | jq '{graph, providers: [.providers[] | {role, provider, real}]}'

          # Cartoon publishing requires generated recurring-character artwork.
          # A deploy with a missing/empty FAL_KEY must fail here instead of
          # quietly putting FakeImageProvider in front of the real compositor.
          if ! echo "$config" | jq -e '.providers[] | select(.role == "images" and .real == true)' > /dev/null; then
            echo "::error::cartoon image provider is not live after deploy; verify the production FAL_KEY secret"
            exit 1
          fi

      - name: Cleanup
        run: |
          # `docker image prune -f` only removes dangling images and does not
          # touch the build cache at all. Every deploy adds layers, so the cache
          # grew unbounded — it reached 103 GB on an 84%-full disk before anyone
          # looked, which would eventually have failed renders and deploys with
          # an error pointing nowhere near the cause.
          docker builder prune -f --keep-storage 20GB
          # Unused images older than a week. Recent ones stay so rebuilds are
          # still fast; -a without the filter would evict base images on every
          # deploy and make each build re-pull them.
          docker image prune -af --filter "until=168h"

          echo "=== Deploy complete ==="
          docker compose ps

      - name: Disk
        if: always()
        run: |
          df -h / | tail -1
          docker system df
          # Fail the deploy loudly while there is still room to fix it, rather
          # than silently at 100% during a render.
          used=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          if [ "$used" -ge 85 ]; then
            echo "::error::disk is ${used}% full after cleanup — investigate before it fills"
            exit 1
          fi
          echo "disk ${used}% used"

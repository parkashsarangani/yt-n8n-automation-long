name: Apply integrated visual quality overhaul

on:
  push:
    branches:
      - feat/integrated-visual-quality-9

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/integrated-visual-quality-9
          fetch-depth: 0

      - name: Apply asserted source transformation
        run: python3 scripts/apply_visual_quality_overhaul.py

      - name: Normalize generated source hygiene
        run: |
          python3 - <<'PY'
          from pathlib import Path

          prompt = Path('engine/prompts/cartoon_visual_planner/13.md')
          if prompt.exists():
              prompt.write_text(prompt.read_text().rstrip() + '\n')

          root = Path('long-compose/remotion/src/Root.tsx')
          s = root.read_text()
          names = [
              'StatReveal', 'Comparison', 'KineticText', 'CaptionOverlay',
              'SceneTransition', 'DataTimeline', 'DataRanking', 'DataBarChart',
              'ListNumberedVertical', 'CartoonScene',
          ]
          for name in names:
              old = f'component={{{name}}}'
              new = f'component={{{name} as unknown as React.ComponentType<Record<string, unknown>>}}'
              if old in s:
                  s = s.replace(old, new)
          root.write_text(s)
          PY

      - name: Verify transformation
        run: git diff --check

      - name: Install ffmpeg for render contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install long-compose and Remotion dependencies
        working-directory: long-compose
        run: |
          npm install --no-audit --no-fund
          npm ci --prefix remotion

      - name: Test long-compose including real Remotion renders
        working-directory: long-compose
        run: npm test

      - name: Type-check Remotion renderer
        working-directory: long-compose/remotion
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test engine
        working-directory: engine
        run: |
          npm ci
          npm test

      - name: Remove one-shot transformation machinery
        run: |
          rm -f scripts/apply_visual_quality_overhaul.py
          rm -f .github/workflows/apply-integrated-visual-quality.yml

      - name: Commit integrated overhaul
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes produced" >&2
            exit 1
          fi
          git commit -m "feat: integrated 9/10 visual quality overhaul"
          git push origin HEAD:feat/integrated-visual-quality-9

name: Apply environment layer policy patch

on:
  push:
    branches:
      - feat/integrated-visual-quality-9
    paths:
      - .github/cinematic-shot-blocking-trigger

permissions:
  contents: write
  statuses: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integrated-visual-quality-9
          fetch-depth: 0

      - name: Publish patch run identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"environment-layer-patch","description":"patch run %s started","target_url":"https://github.com/%s/actions/runs/%s"}' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

      - name: Prefer authored layered environments over replacement plates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bg = Path('long-compose/remotion/src/components/Background.tsx')
          text = bg.read_text()
          old = '''    const scenePlate = scenePlateFor(background);\n    const replaceLayers = scenePlate?.compositeMode === "replace-background";'''
          new = '''    const scenePlate = scenePlateFor(background);\n    const hasAuthoredLayers = Boolean(background.layers?.back || background.layers?.middle || background.layers?.front);\n    const useReplacementPlate = scenePlate?.compositeMode === "replace-background" && !hasAuthoredLayers;\n    const useOverlayPlate = scenePlate?.compositeMode === "overlay";'''
          assert old in text, 'background replacement policy drifted'
          text = text.replace(old, new, 1)

          old_render = '''            <ScenePlate asset={scenePlate} />\n            {!replaceLayers && <BackgroundLayersView background={background} panX={panX} ambientBase={ambientBase} ambient={ambient} />}\n            {/* Layered back plates are opaque; dressing must render after them to stay visible. */}'''
          new_render = '''            {useReplacementPlate && <ScenePlate asset={scenePlate} />}\n            {!useReplacementPlate && <BackgroundLayersView background={background} panX={panX} ambientBase={ambientBase} ambient={ambient} />}\n            {useOverlayPlate && <ScenePlate asset={scenePlate} />}\n            {/* Authored layers are the primary environment when available; dressing stays above opaque back plates. */}'''
          assert old_render in text, 'background render stack drifted'
          text = text.replace(old_render, new_render, 1)
          bg.write_text(text)

          test = Path('long-compose/tests/integrated-visual-quality.test.js')
          t = test.read_text()
          declaration = 'const dressing = fs.readFileSync(path.join(root, "remotion/src/components/SceneDressing.tsx"), "utf8");\n'
          assert declaration in t, 'test declarations drifted'
          if 'const backgroundRenderer =' not in t:
              t = t.replace(declaration, declaration + 'const backgroundRenderer = fs.readFileSync(path.join(root, "remotion/src/components/Background.tsx"), "utf8");\n', 1)
          marker = 'test("formerly generic environments now have location-specific dressing", () => {'
          assert marker in t, 'environment test anchor drifted'
          addition = '''test("authored layered environments outrank generic replacement scene plates", () => {\n  assert.match(backgroundRenderer, /hasAuthoredLayers/);\n  assert.match(backgroundRenderer, /useReplacementPlate = scenePlate\\?\\.compositeMode === "replace-background" && !hasAuthoredLayers/);\n  assert.match(backgroundRenderer, /!useReplacementPlate && <BackgroundLayersView/);\n  assert.match(backgroundRenderer, /useOverlayPlate && <ScenePlate/);\n});\n\n'''
          if 'authored layered environments outrank generic replacement scene plates' not in t:
              t = t.replace(marker, addition + marker, 1)
          test.write_text(t)
          PY

      - name: Verify patch shape
        run: |
          grep -Fq 'const hasAuthoredLayers = Boolean' long-compose/remotion/src/components/Background.tsx
          grep -Fq 'const useReplacementPlate = scenePlate?.compositeMode === "replace-background" && !hasAuthoredLayers' long-compose/remotion/src/components/Background.tsx
          grep -Fq '!useReplacementPlate && <BackgroundLayersView' long-compose/remotion/src/components/Background.tsx
          git diff --check

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add long-compose/remotion/src/components/Background.tsx long-compose/tests/integrated-visual-quality.test.js
          git commit -m 'fix: prefer authored layered environments over scene plates' || exit 0
          git push origin HEAD:feat/integrated-visual-quality-9

      - name: Publish final patch status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"environment-layer-patch","description":"patch run %s %s","target_url":"https://github.com/%s/actions/runs/%s"}' "$state" "$GITHUB_RUN_ID" "$JOB_STATUS" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" || true

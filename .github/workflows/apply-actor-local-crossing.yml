name: Apply cinematic shot blocking patch

on:
  push:
    branches:
      - feat/integrated-visual-quality-9
    paths:
      - .github/cinematic-shot-blocking-trigger

permissions:
  contents: write
  statuses: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integrated-visual-quality-9
          fetch-depth: 0

      - name: Publish patch run identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"cinematic-shot-patch","description":"patch run %s started","target_url":"https://github.com/%s/actions/runs/%s"}' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

      - name: Apply cinematic shot blocking patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scene = Path('long-compose/remotion/src/compositions/CartoonScene.tsx')
          text = scene.read_text()

          marker = 'function HandHeldPropOverlay({\n'
          assert marker in text, 'hand-held overlay marker drifted'
          helper = r'''function withCinematicRecipeBlocking(characters: CharacterProps[], cinematic?: CinematicSceneSpec): CharacterProps[] {
    if (!characters.length) return characters;
    const recipe = normalizedShotRecipe(cinematic?.shotRecipe);
    let activeIndex = characters.findIndex((character) => character.isSpeaking);
    if (activeIndex < 0) activeIndex = 0;

    return characters.map((character, index) => {
        const active = index === activeIndex;
        const baseScale = Number.isFinite(character.scale) ? character.scale! : 1;
        switch (recipe) {
            case "establishing":
                return { ...character, y: character.y + 58, scale: baseScale * 0.80 };
            case "reaction-closeup":
                return active
                    ? { ...character, x: 710, y: 138, scale: baseScale * 1.34, gazeTarget: "camera" }
                    : { ...character, x: index < activeIndex ? -250 : 1370, y: 252, scale: baseScale * 1.08, dimmed: true };
            case "prop-insert":
                return active
                    ? { ...character, x: 190, y: 300, scale: baseScale * 0.72, gazeTarget: "right" }
                    : { ...character, x: index < activeIndex ? -250 : 1390, y: 300, scale: baseScale * 0.68, dimmed: true };
            case "over-shoulder":
                return active
                    ? { ...character, x: 710, y: 205, scale: baseScale * 1.02, gazeTarget: activeIndex === 0 ? "right" : "left" }
                    : { ...character, x: index < activeIndex ? -130 : 1290, y: 238, scale: baseScale * 1.30, dimmed: true, gazeTarget: activeIndex === 0 ? "left" : "right" };
            case "payoff-hold":
                return active
                    ? { ...character, x: 700, y: 142, scale: baseScale * 1.22, gazeTarget: "camera" }
                    : { ...character, x: index < activeIndex ? -220 : 1360, y: 280, scale: baseScale * 0.80, dimmed: true };
            case "callback-reveal":
                return active
                    ? { ...character, x: 680, y: 170, scale: baseScale * 1.14, gazeTarget: "camera" }
                    : { ...character, x: index < activeIndex ? -180 : 1340, y: 270, scale: baseScale * 0.84, dimmed: true };
            case "crossing-transition":
            case "two-shot":
            default:
                return character;
        }
    });
}

'''
          text = text.replace(marker, helper + marker, 1)

          old = '''    const directedCharacters = useMemo(
        () => withConversationDirection(stagedCharacters, speakerEmphasis),
        [stagedCharacters, speakerEmphasis],
    );'''
          new = '''    const recipeBlockedCharacters = useMemo(
        () => withCinematicRecipeBlocking(stagedCharacters, cinematic),
        [stagedCharacters, cinematic],
    );

    const directedCharacters = useMemo(
        () => withConversationDirection(recipeBlockedCharacters, speakerEmphasis),
        [recipeBlockedCharacters, speakerEmphasis],
    );'''
          assert old in text, 'conversation staging block drifted'
          text = text.replace(old, new, 1)

          replacements = {
              'x={insert ? 1000 : hand.x - 54}': 'x={insert ? 1030 : hand.x - 54}',
              'y={insert ? 342 : hand.y - 102}': 'y={insert ? 250 : hand.y - 102}',
              'scale={(insert ? 1.22 : 0.64) * visualStyle.propScale}': 'scale={(insert ? 1.85 : 0.64) * visualStyle.propScale}',
          }
          for old, new in replacements.items():
              assert old in text, f'prop insert shape drifted: {old}'
              text = text.replace(old, new, 1)
          scene.write_text(text)

          test = Path('long-compose/tests/integrated-visual-quality.test.js')
          t = test.read_text()
          anchor = 'test("central charger is a physical self-authored object, not the MDI icon card", () => {'
          assert anchor in t, 'integrated quality test anchor drifted'
          addition = '''test("cinematic recipes produce dedicated blocking instead of generic two-shots", () => {\n  assert.match(scene, /withCinematicRecipeBlocking/);\n  for (const recipe of ["reaction-closeup", "prop-insert", "over-shoulder", "payoff-hold"]) {\n    assert.match(scene, new RegExp(`case "${recipe}"`));\n  }\n  assert.match(scene, /insert \\? 1\\.85 : 0\\.64/);\n});\n\n'''
          t = t.replace(anchor, addition + anchor, 1)
          test.write_text(t)
          PY

      - name: Verify patch shape
        run: |
          grep -q 'withCinematicRecipeBlocking' long-compose/remotion/src/compositions/CartoonScene.tsx
          grep -Fq 'insert ? 1.85 : 0.64' long-compose/remotion/src/compositions/CartoonScene.tsx
          git diff --check

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add long-compose/remotion/src/compositions/CartoonScene.tsx long-compose/tests/integrated-visual-quality.test.js
          git commit -m 'feat: make cinematic recipes visually distinct' || exit 0
          git push origin HEAD:feat/integrated-visual-quality-9

      - name: Publish final patch status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"cinematic-shot-patch","description":"patch run %s %s","target_url":"https://github.com/%s/actions/runs/%s"}' "$state" "$GITHUB_RUN_ID" "$JOB_STATUS" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" || true

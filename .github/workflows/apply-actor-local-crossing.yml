name: Apply cinematic shot blocking patch

on:
  push:
    branches:
      - feat/integrated-visual-quality-9
    paths:
      - .github/cinematic-shot-blocking-trigger

permissions:
  contents: write
  statuses: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integrated-visual-quality-9
          fetch-depth: 0

      - name: Publish patch run identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"cinematic-shot-patch","description":"patch run %s started","target_url":"https://github.com/%s/actions/runs/%s"}' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

      - name: Tune reaction crop and OTS foreground depth
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scene = Path('long-compose/remotion/src/compositions/CartoonScene.tsx')
          text = scene.read_text()
          replacements = {
              '? { ...character, x: 690, y: 224, scale: baseScale * 1.12, gazeTarget: "camera" }': '? { ...character, x: 690, y: 500, scale: baseScale * 1.48, gazeTarget: "camera" }',
              '? { ...character, x: 760, y: 276, scale: baseScale * 0.98, gazeTarget: activeIndex === 0 ? "right" : "left" }': '? { ...character, x: 760, y: 300, scale: baseScale * 0.98, gazeTarget: activeIndex === 0 ? "right" : "left" }',
              ': { ...character, x: index < activeIndex ? -480 : 1500, y: 128, scale: baseScale * 1.72, dimmed: true, gazeTarget: activeIndex === 0 ? "left" : "right" };': ': { ...character, x: index < activeIndex ? -440 : 1500, y: 450, scale: baseScale * 1.55, dimmed: true, gazeTarget: activeIndex === 0 ? "left" : "right" };',
          }
          for old, new in replacements.items():
              count = text.count(old)
              assert count == 1, f'expected one shot-blocking target, got {count}: {old}'
              text = text.replace(old, new, 1)
          scene.write_text(text)
          PY

      - name: Verify patch shape
        run: |
          grep -Fq 'x: 690, y: 500, scale: baseScale * 1.48' long-compose/remotion/src/compositions/CartoonScene.tsx
          grep -Fq 'x: index < activeIndex ? -440 : 1500, y: 450, scale: baseScale * 1.55' long-compose/remotion/src/compositions/CartoonScene.tsx
          git diff --check

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add long-compose/remotion/src/compositions/CartoonScene.tsx
          git commit -m 'feat: crop reaction and OTS shots for cinematic depth' || exit 0
          git push origin HEAD:feat/integrated-visual-quality-9

      - name: Publish final patch status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"cinematic-shot-patch","description":"patch run %s %s","target_url":"https://github.com/%s/actions/runs/%s"}' "$state" "$GITHUB_RUN_ID" "$JOB_STATUS" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" || true

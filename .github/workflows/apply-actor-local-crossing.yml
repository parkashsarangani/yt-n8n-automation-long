name: Apply physical prop insert patch

on:
  push:
    branches:
      - feat/integrated-visual-quality-9
    paths:
      - .github/cinematic-shot-blocking-trigger

permissions:
  contents: write
  statuses: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integrated-visual-quality-9
          fetch-depth: 0

      - name: Publish patch run identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"physical-prop-insert-patch","description":"patch run %s started","target_url":"https://github.com/%s/actions/runs/%s"}' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

      - name: Anchor prop inserts to the actor palm
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scene = Path('long-compose/remotion/src/compositions/CartoonScene.tsx')
          text = scene.read_text()
          old_block = '''            case "prop-insert":\n                return active\n                    ? { ...character, x: 190, y: 300, scale: baseScale * 0.72, gazeTarget: "right" }\n                    : { ...character, x: index < activeIndex ? -250 : 1390, y: 300, scale: baseScale * 0.68, dimmed: true };'''
          new_block = '''            case "prop-insert":\n                return active\n                    ? { ...character, x: 420, y: 320, scale: baseScale * 1.05, gazeTarget: "right" }\n                    : { ...character, x: index < activeIndex ? -520 : 1680, y: 340, scale: baseScale * 0.72, dimmed: true };'''
          assert old_block in text, 'prop-insert character blocking drifted'
          text = text.replace(old_block, new_block, 1)

          old_vars = '''    const recipe = normalizedShotRecipe(cinematic?.shotRecipe);\n    const insert = recipe === "prop-insert";\n    const directedProp: ForegroundPropSpec = { ...prop, placement: "hand-held", renderMode: "physical" };'''
          new_vars = '''    const recipe = normalizedShotRecipe(cinematic?.shotRecipe);\n    const insert = recipe === "prop-insert";\n    const propX = hand.x - (insert ? 82 : 54);\n    const propY = hand.y - (insert ? 126 : 102);\n    const propScale = insert ? 1.35 : 0.64;\n    const directedProp: ForegroundPropSpec = { ...prop, placement: "hand-held", renderMode: "physical" };'''
          assert old_vars in text, 'prop overlay variables drifted'
          text = text.replace(old_vars, new_vars, 1)

          replacements = {
              'x={insert ? 1030 : hand.x - 54}': 'x={propX}',
              'y={insert ? 250 : hand.y - 102}': 'y={propY}',
              'scale={(insert ? 1.85 : 0.64) * visualStyle.propScale}': 'scale={propScale * visualStyle.propScale}',
              'rotate={insert ? "-4deg" : (side === "right" ? "-10deg" : "10deg")}': 'rotate={insert ? (side === "right" ? "-6deg" : "6deg") : (side === "right" ? "-10deg" : "10deg")}',
          }
          for old, new in replacements.items():
              assert old in text, f'prop overlay target drifted: {old}'
              text = text.replace(old, new, 1)
          scene.write_text(text)

          test = Path('long-compose/tests/integrated-visual-quality.test.js')
          t = test.read_text()
          t = t.replace('  assert.match(scene, /insert \\? 1\\.85 : 0\\.64/);', '  assert.match(scene, /const propScale = insert \\? 1\\.35 : 0\\.64/);')
          marker = 'test("central charger is a physical self-authored object, not the MDI icon card", () => {'
          assert marker in t, 'prop asset test anchor drifted'
          addition = '''test("prop inserts remain physically palm-anchored instead of floating at fixed screen coordinates", () => {\n  assert.match(scene, /const propX = hand\\.x - \\(insert \\? 82 : 54\\)/);\n  assert.match(scene, /const propY = hand\\.y - \\(insert \\? 126 : 102\\)/);\n  assert.doesNotMatch(scene, /x=\\{insert \\? 1030/);\n  assert.doesNotMatch(scene, /y=\\{insert \\? 250/);\n});\n\n'''
          if 'prop inserts remain physically palm-anchored' not in t:
              t = t.replace(marker, addition + marker, 1)
          test.write_text(t)
          PY

      - name: Verify patch shape
        run: |
          grep -Fq 'x: 420, y: 320, scale: baseScale * 1.05' long-compose/remotion/src/compositions/CartoonScene.tsx
          grep -Fq 'const propX = hand.x - (insert ? 82 : 54)' long-compose/remotion/src/compositions/CartoonScene.tsx
          grep -Fq 'const propScale = insert ? 1.35 : 0.64' long-compose/remotion/src/compositions/CartoonScene.tsx
          git diff --check

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add long-compose/remotion/src/compositions/CartoonScene.tsx long-compose/tests/integrated-visual-quality.test.js
          git commit -m 'fix: keep prop inserts physically attached to the actor' || exit 0
          git push origin HEAD:feat/integrated-visual-quality-9

      - name: Publish final patch status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"physical-prop-insert-patch","description":"patch run %s %s","target_url":"https://github.com/%s/actions/runs/%s"}' "$state" "$GITHUB_RUN_ID" "$JOB_STATUS" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" || true

name: RFC 0010 Live Media Smoke

on:
  # The RFC 0010 dev loop. A push to the candidate surface auto-runs the live
  # smoke: no RFC 0009 control regen, cached ElevenLabs narration, and the
  # persistent image bank means an unchanged beat costs no fal.ai spend. Cheap
  # enough to run on every iteration.
  push:
    branches: [rfc-0010-visual-director]
    paths:
      - ".github/workflows/rfc0010-live-media-smoke.yml"
      - "engine/scripts/rfc0010-live-media-smoke.ts"
      - "engine/scripts/rfc0010-smoke-preflight.ts"
      - "engine/src/visual-smoke.ts"
      - "engine/src/visual-routing.ts"
      - "engine/src/vision-route-health.ts"
      - "engine/src/audio/beat-alignment.ts"
      - "engine/src/visual-beat-qa.ts"
      - "engine/src/visual-benchmark-judge.ts"
      - "engine/src/workers/visual-beat-resolver.ts"
      - "engine/src/workers/visual-timeline.ts"
      - "engine/src/workers/tts-moderation.ts"
      - "engine/src/moderation/**"
      - "engine/src/providers/cached-image.ts"
      - "engine/graphs/visual_live_media_smoke.json"
      - "engine/prompts/visual_director/**"
  workflow_dispatch:
    inputs:
      run_live_media:
        description: "Run live Pexels/Fal/vision/TTS-backed smoke after deterministic validation"
        required: false
        type: boolean
        default: false
      refresh_voice_fixture:
        description: "Regenerate the cached ElevenLabs narration fixture (only when live media runs)"
        required: false
        type: boolean
        default: false

concurrency:
  group: rfc0010-live-media-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: RFC0010 fixed-input live-media smoke
    runs-on: self-hosted
    environment: production
    timeout-minutes: 75
    env:
      FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
      FREELLMAPI_TEXT_MODEL: gemini-3.5-flash
      FREELLMAPI_VISION_MODEL: ${{ vars.FREELLMAPI_VISION_MODEL || 'auto:smart' }}
      LLM_ROUTER_MODE: freellmapi
      LLM_ROUTER_FAIL_OPEN_TO_DIRECT: ${{ vars.LLM_ROUTER_FAIL_OPEN_TO_DIRECT || 'true' }}
      LLM_ROUTER_TIMEOUT_MS: ${{ vars.LLM_ROUTER_TIMEOUT_MS || '120000' }}
      SHARED_LLM_NETWORK: ${{ vars.SHARED_LLM_NETWORK || 'yt-n8n-automation-shorts_default' }}

      OPENAI_API_KEY: ${{ secrets.OPEN_AI_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      OPENAI_MODERATION_MODEL: ${{ vars.OPENAI_MODERATION_MODEL || 'omni-moderation-latest' }}
      TTS_MODERATION_TIMEOUT_MS: ${{ vars.TTS_MODERATION_TIMEOUT_MS || '30000' }}

      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      SPEECH_PROVIDER_MODE: elevenlabs

      FAL_KEY: ${{ secrets.FAL_KEY }}
      FAL_MODEL: ${{ vars.FAL_MODEL || 'fal-ai/flux-2' }}
      FAL_EDIT_MODEL: ${{ vars.FAL_EDIT_MODEL || '' }}
      FAL_TEXT_TO_VIDEO_MODEL: ${{ vars.FAL_TEXT_TO_VIDEO_MODEL || 'fal-ai/kling-video/v2.5-turbo/pro/text-to-video' }}
      FAL_PRICE_PER_IMAGE: ${{ vars.FAL_PRICE_PER_IMAGE || '' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      IMAGE_QA_TIMEOUT_MS: ${{ vars.IMAGE_QA_TIMEOUT_MS || '45000' }}
      RFC0010_SMOKE_FIXTURE_CACHE: /fixture-cache
      RFC0010_SMOKE_REFRESH_VOICE: ${{ inputs.refresh_voice_fixture && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Build engine for deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p vidgen-rfc0010-smoke build engine

      - name: Deterministic engine validation
        shell: bash
        run: |
          set -euo pipefail
          # The job env carries live provider secrets for the live smoke, and
          # `compose run` injects the compose `engine.environment` block. The
          # unit suite expects a clean environment (many tests assert routing
          # behaviour with no keys configured), so blank every provider var for
          # the deterministic run only. Mirrors ci.yml's `docker run` isolation.
          clean_env=(
            -e LLM_ROUTER_MODE= -e LLM_ROUTER_FAIL_OPEN_TO_DIRECT= -e LLM_ROUTER_TIMEOUT_MS=
            -e FREELLMAPI_API_KEY= -e FREELLMAPI_BASE_URL= -e FREELLMAPI_TEXT_MODEL= -e FREELLMAPI_VISION_MODEL=
            -e OPENAI_API_KEY= -e OPENAI_BASE_URL= -e OPENAI_MODEL= -e OPENAI_MODERATION_MODEL= -e OPENAI_IMAGE_QA_MODEL=
            -e ELEVENLABS_API_KEY= -e ELEVENLABS_VOICE_ID= -e SPEECH_PROVIDER_MODE=
            -e FAL_KEY= -e FAL_MODEL= -e FAL_EDIT_MODEL= -e FAL_TEXT_TO_VIDEO_MODEL= -e FAL_PRICE_PER_IMAGE=
            -e PEXELS_API_KEY= -e IMAGE_BANK_DIR= -e IMAGE_QA_TIMEOUT_MS=
          )
          docker compose -p vidgen-rfc0010-smoke run --rm --no-deps "${clean_env[@]}" engine npm run typecheck
          docker compose -p vidgen-rfc0010-smoke run --rm --no-deps "${clean_env[@]}" engine npm test

      - name: Validation-only complete
        if: ${{ !inputs.run_live_media && github.event_name != 'push' }}
        shell: bash
        run: |
          echo "RFC 0010 smoke deterministic validation complete."
          echo "run_live_media=false: no Gemini/OpenAI/Fal/Pexels/ElevenLabs requests were made by this workflow."

      - name: Validate live smoke configuration
        if: ${{ inputs.run_live_media || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          for key in FREELLMAPI_API_KEY OPENAI_API_KEY ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID FAL_KEY PEXELS_API_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key is required for the RFC 0010 live-media smoke test"
              exit 1
            fi
          done
          if [[ "$FREELLMAPI_TEXT_MODEL" == auto* ]] || [[ ! "$FREELLMAPI_TEXT_MODEL" =~ [Gg][Ee][Mm][Ii][Nn][Ii] ]]; then
            echo "::error::text decisions must remain pinned to a concrete Gemini model; got $FREELLMAPI_TEXT_MODEL"
            exit 1
          fi

      - name: Build isolated live-media compositor
        if: ${{ inputs.run_live_media || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f vidgen-rfc0010-smoke-engine vidgen-rfc0010-smoke-compose >/dev/null 2>&1 || true
          docker volume create rfc0010-smoke-fixtures >/dev/null
          docker volume create rfc0010-image-bank >/dev/null
          docker compose -p vidgen-rfc0010-smoke build long-compose

      - name: Start isolated compositor
        if: ${{ inputs.run_live_media || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p vidgen-rfc0010-smoke run -d --name vidgen-rfc0010-smoke-compose --no-deps long-compose >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec vidgen-rfc0010-smoke-compose curl -sf http://127.0.0.1:4000/topic-history >/dev/null 2>&1; then
              echo "isolated long-compose ready"
              exit 0
            fi
            sleep 4
          done
          docker logs --tail=100 vidgen-rfc0010-smoke-compose || true
          echo "::error::isolated long-compose did not become healthy"
          exit 1

      - name: Start engine and verify reasoning route
        if: ${{ inputs.run_live_media || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p vidgen-rfc0010-smoke run -d --name vidgen-rfc0010-smoke-engine --no-deps \
            -v rfc0010-smoke-fixtures:/fixture-cache \
            -v rfc0010-image-bank:/image-bank \
            -e IMAGE_BANK_DIR=/image-bank \
            -e COMPOSE_URL=http://vidgen-rfc0010-smoke-compose:4000 \
            engine sleep infinity >/dev/null

          if ! docker network inspect "$SHARED_LLM_NETWORK" >/dev/null 2>&1; then
            echo "::error::shared FreeLLMAPI network $SHARED_LLM_NETWORK is unavailable"
            exit 1
          fi
          docker network connect "$SHARED_LLM_NETWORK" vidgen-rfc0010-smoke-engine

          # Development smoke must not spend 12 minutes proving a known Gemini
          # quota outage. Try the pinned route, then quickly verify the same
          # configured direct fail-open used by runtime.
          docker exec vidgen-rfc0010-smoke-engine node --import tsx scripts/rfc0010-smoke-preflight.ts

      - name: Run fixed-input live-media smoke
        if: ${{ inputs.run_live_media || github.event_name == 'push' }}
        id: smoke
        shell: bash
        run: |
          set -uo pipefail
          docker exec vidgen-rfc0010-smoke-engine \
            node --import tsx scripts/rfc0010-live-media-smoke.ts \
            2>&1 | tee rfc0010-live-media-smoke.log
          status=${PIPESTATUS[0]}

          rm -rf rfc0010-live-media-smoke-export
          docker cp vidgen-rfc0010-smoke-engine:/data/rfc0010-live-media-smoke-export ./rfc0010-live-media-smoke-export >/dev/null 2>&1 || true

          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

          node -e "const fs=require('fs');const p='rfc0010-live-media-smoke-export/smoke-report.json';if(!fs.existsSync(p)){console.error('missing smoke-report.json');process.exit(1)}const r=JSON.parse(fs.readFileSync(p,'utf8'));console.log('smoke pass='+r.pass);if(!r.pass){console.error(JSON.stringify({technical:r.technical_failures,sourcing:r.sourcing_failures,efficiency:r.efficiency_failures,coverage:r.coverage_failures,quality:r.quality_failures},null,2));process.exit(2)}"

      - name: Upload smoke render and diagnostics
        if: ${{ always() && (inputs.run_live_media || github.event_name == 'push') }}
        uses: actions/upload-artifact@v4
        with:
          name: rfc0010-live-media-smoke-${{ github.run_number }}
          path: |
            rfc0010-live-media-smoke-export/
            rfc0010-live-media-smoke.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup isolated smoke runtime
        if: ${{ always() && (inputs.run_live_media || github.event_name == 'push') }}
        shell: bash
        run: |
          docker rm -f vidgen-rfc0010-smoke-engine vidgen-rfc0010-smoke-compose >/dev/null 2>&1 || true
          docker compose -p vidgen-rfc0010-smoke down -v --remove-orphans >/dev/null 2>&1 || true
          # Intentionally preserve the standalone rfc0010-smoke-fixtures volume:
          # subsequent smoke runs reuse the exact same narration + timestamps.

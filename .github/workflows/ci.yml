name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts and compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Motion compatibility contract is synchronized
        run: cmp contracts/motion-compatibility.json long-compose/remotion/src/motion-compatibility.json

      - name: Motion visual identity contract is synchronized
        run: npx --yes tsx --test contracts/motion-visual-identity.test.ts

      - name: Compose file is valid and starts the right services
        run: |
          set -e
          services=$(docker compose config --services | sort | tr '\n' ' ')
          echo "default services: $services"
          [ "$services" = "engine long-compose postgres " ] || {
            echo "ERROR: expected exactly 'engine long-compose postgres' by default"
            exit 1
          }

      - name: RFC 0010 provider deployment contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          compose = Path("docker-compose.yml").read_text()
          deploy = Path(".github/workflows/deploy.yml").read_text()

          for required in (
              "FREELLMAPI_BASE_URL: ${FREELLMAPI_BASE_URL:-http://freellmapi:3001/v1}",
              "FREELLMAPI_API_KEY:",
              "FREELLMAPI_TEXT_MODEL: ${FREELLMAPI_TEXT_MODEL:-gemini-3.5-flash}",
              "FREELLMAPI_VISION_MODEL:",
              "FAL_KEY:",
              "FAL_MODEL: ${FAL_MODEL:-fal-ai/flux-2}",
              "FAL_EDIT_MODEL:",
              "SPEECH_PROVIDER_MODE: ${SPEECH_PROVIDER_MODE:-elevenlabs}",
          ):
              assert required in compose, f"missing RFC 0010 provider contract: {required}"

          for forbidden in (
              r"(?m)^  freellmapi:\s*$",
              r"(?m)^  llm-gateway:\s*$",
              r"(?m)^  freellmapi_data:\s*$",
              r"IMAGE_PROVIDER_MODE",
              r"FREELLMAPI_IMAGE_MODEL",
              r"FREELLMAPI_HERO_IMAGE",
          ):
              assert not re.search(forbidden, compose), f"obsolete image infrastructure remains in compose: {forbidden}"

          for required in (
              "yt-n8n-automation-shorts_default",
              'docker network connect "$SHARED_LLM_NETWORK" "$ENGINE_CID"',
              "http://freellmapi:3001/api/ping",
              "FREELLMAPI_API_KEY:",
              "LLM_ROUTER_MODE:",
              "FREELLMAPI_TEXT_MODEL: gemini-3.5-flash",
              "/v1/chat/completions",
              "SPEECH_PROVIDER_MODE: elevenlabs",
              "FAL_KEY:",
              "FAL_MODEL:",
              "sole image-generation provider",
              "direct OpenAI fail-open",
          ):
              assert required in deploy, f"missing production RFC 0010 contract: {required}"

          for forbidden in (
              "IMAGE_PROVIDER_MODE:",
              "FREELLMAPI_IMAGE_MODEL:",
              "FREELLMAPI_HERO_IMAGE_MODEL:",
              "/v1/images/generations",
              "Models -> Image",
              "standard image row",
          ):
              assert forbidden not in deploy, f"obsolete FreeLL image deployment contract remains: {forbidden}"

          # The unified key is inference-only. Long must never impersonate a
          # dashboard session or mutate the Shorts-owned FreeLL media registry.
          assert "fetch(base+'/api/media')" not in deploy
          assert "'/api/media/'" not in deploy
          assert "x-dashboard-token" not in deploy.lower()

          assert "secrets." + "FREELLMAPI_API_KEY" in deploy
          assert "vars." + "LLM_ROUTER_MODE" in deploy
          assert "secrets." + "FAL_KEY" in deploy
          assert "vars." + "FAL_MODEL" in deploy
          print("RFC 0010 provider deployment contract OK")
          PY

  engine:
    name: Engine build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine image
        run: docker build -t engine:pr-${{ github.event.pull_request.number }} ./engine
      - name: Typecheck
        run: docker run --rm engine:pr-${{ github.event.pull_request.number }} npm run typecheck
      - name: Test engine
        run: docker run --rm engine:pr-${{ github.event.pull_request.number }} npm test

  long-compose-motion:
    name: Long-compose contracts and motion render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build long-compose image (no push)
        run: docker build -t long-compose:pr-${{ github.event.pull_request.number }} ./long-compose
      - name: Typecheck Remotion
        run: |
          docker run --rm --entrypoint sh long-compose:pr-${{ github.event.pull_request.number }} -lc 'cd /app/remotion && npx tsc --noEmit'
      - name: Source contracts
        run: docker run --rm --entrypoint npm long-compose:pr-${{ github.event.pull_request.number }} run test:contracts
      - name: Motion render regression
        run: docker run --rm --entrypoint npm long-compose:pr-${{ github.event.pull_request.number }} run test:render:motion

  long-compose-output:
    name: Long-compose output quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build long-compose image (no push)
        run: docker build -t long-compose:pr-${{ github.event.pull_request.number }} ./long-compose
      - name: Output quality
        run: docker run --rm --entrypoint npm long-compose:pr-${{ github.event.pull_request.number }} run test:render:output

  rfc0010-live-benchmark:
    name: RFC 0010 live visual benchmark
    if: github.event.pull_request.head.ref == 'rfc-0010-visual-director'
    needs: [contracts, engine, long-compose-motion, long-compose-output]
    runs-on: self-hosted
    environment: production
    timeout-minutes: 120
    env:
      FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
      FREELLMAPI_TEXT_MODEL: gemini-3.5-flash
      FREELLMAPI_VISION_MODEL: ${{ vars.FREELLMAPI_VISION_MODEL || 'auto:smart' }}
      LLM_ROUTER_MODE: freellmapi
      LLM_ROUTER_FAIL_OPEN_TO_DIRECT: ${{ vars.LLM_ROUTER_FAIL_OPEN_TO_DIRECT || 'true' }}
      LLM_ROUTER_TIMEOUT_MS: ${{ vars.LLM_ROUTER_TIMEOUT_MS || '120000' }}
      SHARED_LLM_NETWORK: ${{ vars.SHARED_LLM_NETWORK || 'yt-n8n-automation-shorts_default' }}
      OPENAI_API_KEY: ${{ secrets.OPEN_AI_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      SPEECH_PROVIDER_MODE: elevenlabs
      FAL_KEY: ${{ secrets.FAL_KEY }}
      FAL_MODEL: ${{ vars.FAL_MODEL || 'fal-ai/flux-2' }}
      FAL_EDIT_MODEL: ${{ vars.FAL_EDIT_MODEL || '' }}
      FAL_TEXT_TO_VIDEO_MODEL: ${{ vars.FAL_TEXT_TO_VIDEO_MODEL || 'fal-ai/kling-video/v2.5-turbo/pro/text-to-video' }}
      FAL_PRICE_PER_IMAGE: ${{ vars.FAL_PRICE_PER_IMAGE || '' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Validate live benchmark configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in FREELLMAPI_API_KEY ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID FAL_KEY PEXELS_API_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key is required for the live RFC 0010 benchmark"
              exit 1
            fi
          done
          if [[ "$FREELLMAPI_TEXT_MODEL" == auto* ]] || [[ ! "$FREELLMAPI_TEXT_MODEL" =~ [Gg][Ee][Mm][Ii][Nn][Ii] ]]; then
            echo "::error::text decisions must be pinned to a concrete Gemini model; got $FREELLMAPI_TEXT_MODEL"
            exit 1
          fi

      - name: Build isolated benchmark containers
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f vidgen-benchmark-engine vidgen-benchmark-compose >/dev/null 2>&1 || true
          docker compose -p vidgen-benchmark build engine long-compose

      - name: Start isolated compositor
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p vidgen-benchmark run -d --name vidgen-benchmark-compose --no-deps long-compose >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec vidgen-benchmark-compose curl -sf http://127.0.0.1:4000/topic-history >/dev/null 2>&1; then
              echo "isolated long-compose ready"
              exit 0
            fi
            sleep 4
          done
          docker logs --tail=100 vidgen-benchmark-compose || true
          echo "::error::isolated long-compose did not become healthy"
          exit 1

      - name: Start isolated engine shell and attach shared FreeLLAPI
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p vidgen-benchmark run -d --name vidgen-benchmark-engine --no-deps \
            -e COMPOSE_URL=http://vidgen-benchmark-compose:4000 \
            engine sleep infinity >/dev/null
          if ! docker network inspect "$SHARED_LLM_NETWORK" >/dev/null 2>&1; then
            echo "::error::shared FreeLLMAPI network $SHARED_LLM_NETWORK is unavailable"
            exit 1
          fi
          docker network connect "$SHARED_LLM_NETWORK" vidgen-benchmark-engine
          # Bounded-retry pre-flight: a transient shared-key 429 must not destroy
          # the 120-minute benchmark; genuine auth/model errors still fail fast.
          docker exec vidgen-benchmark-engine node --import tsx scripts/freellmapi-smoke.ts

      - name: Generate control and RFC 0010 candidate
        shell: bash
        run: |
          set -euo pipefail
          docker exec vidgen-benchmark-engine node --import tsx scripts/rfc0010-benchmark-e2e.ts 2>&1 | tee rfc0010-benchmark.log
          docker cp vidgen-benchmark-engine:/data/rfc0010-benchmark-export ./rfc0010-benchmark-export

      - name: Upload comparison videos and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfc0010-live-benchmark-${{ github.run_number }}
          path: |
            rfc0010-benchmark-export/
            rfc0010-benchmark.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup isolated benchmark runtime
        if: always()
        shell: bash
        run: |
          docker rm -f vidgen-benchmark-engine vidgen-benchmark-compose >/dev/null 2>&1 || true
          docker compose -p vidgen-benchmark down -v --remove-orphans >/dev/null 2>&1 || true

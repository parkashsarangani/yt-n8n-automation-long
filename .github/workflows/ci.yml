name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Audio-first architecture contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose topology is valid
        run: |
          services=$(docker compose config --services | sort | tr '\n' ' ')
          echo "services: $services"
          [ "$services" = "engine long-compose postgres " ]
      - name: Retired visual stack is absent
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          graph = json.loads(Path('engine/graphs/illustrated_story.json').read_text())
          assert graph['version'] == '10'
          transforms = {n.get('transformation') for n in graph['nodes'] if n.get('transformation')}
          required = {'channel_strategist','growth_packager','growth_package_release','narrative_story_architect','narration_script_writer','watchability_critic','watchability_release','tts_moderation','voice','seo_optimizer','thumbnail_designer','thumbnail','render','qa','publish'}
          assert required <= transforms, sorted(required - transforms)
          forbidden = {'visual_director','visual_planner','visual_beat_assets','visual_timeline','visual_timeline_manifest','visual_beat_release','visual_asset_release','visual_timeline_render','assets'}
          assert not (transforms & forbidden), sorted(transforms & forbidden)

          retired_paths = [
            'contracts',
            'long-compose/remotion',
            'long-compose/motion-assets',
            'docs/0008-illustrated-story-format.md',
            'docs/0010-visual-director-and-multimodal-asset-routing.md',
            'docs/creative-quality-acceptance.md',
            'docs/semantic-visual-representation.md',
            '.github/workflows/free-media-bakeoff.yml',
            'engine/agents/visual_director.json',
            'engine/agents/visual_planner.json',
            'engine/prompts/visual_director',
            'engine/prompts/visual_planner',
            'engine/src/workers/assets.ts',
            'engine/src/workers/illustrated-scene-assets.ts',
            'engine/src/workers/visual-beat-resolver.ts',
            'engine/src/workers/visual-timeline.ts',
            'engine/src/workers/visual-timeline-render.ts',
            'engine/src/workers/visual-timeline-manifest.ts',
            'engine/src/workers/visual-beat-release.ts',
            'engine/src/workers/visual-asset-release.ts',
            'engine/src/workers/visual-benchmark-render.ts',
            'engine/src/workers/visual-benchmark-qa.ts',
          ]
          present = [p for p in retired_paths if Path(p).exists()]
          assert not present, f'retired visual paths remain: {present}'
          print('audio-first architecture contract OK')
          PY

  engine:
    name: Engine build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine image
        run: docker build -t engine:pr-${{ github.event.pull_request.number }} ./engine
      - name: Typecheck
        run: docker run --rm engine:pr-${{ github.event.pull_request.number }} npm run typecheck
      - name: Test engine
        run: docker run --rm engine:pr-${{ github.event.pull_request.number }} npm test

  long-compose:
    name: Audio-first compositor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compositor image
        run: docker build -t long-compose:pr-${{ github.event.pull_request.number }} ./long-compose
      - name: Syntax check
        run: docker run --rm --entrypoint npm long-compose:pr-${{ github.event.pull_request.number }} run check
      - name: Unit tests
        run: docker run --rm --entrypoint npm long-compose:pr-${{ github.event.pull_request.number }} test
